# Alembic CLI config for developers (`uv run alembic ...` from the repo root).
# The database URL is NOT configured here: env.py reads it from MeshForge settings
# (MESHFORGE_DATABASE__* env vars / TOML [database]; see deploy/README.md).
# Logging is configured by env.py through meshforge.common.logging, so this file
# has no [loggers]/[handlers] sections. Programmatic use: meshforge.controller.store.migrate.

[alembic]
script_location = %(here)s/src/meshforge/controller/store/migrations
# Sequential revision IDs, pass --rev-id NNNN: files sort in apply order.
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
