# MeshForge example: reproducible PyTorch training (see README.md).
name: pytorch-train
entrypoint: python main.py --steps 400 --device auto
env:
  base: cuda-pytorch        # promises torch: the image (Docker) or the agent's own env (subprocess), never venv
resources:
  gpu: preferred            # CUDA when the node has it, else CPU
  vram_gb: 1
outputs: [results/]
limits:
  timeout: 20m
  network: none
