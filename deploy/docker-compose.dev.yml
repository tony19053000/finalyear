# MeshForge development database (task 0.1.7). Dev only - NOT a production setup.
#
#   docker compose -f deploy/docker-compose.dev.yml up -d      # start (waits via healthcheck)
#   uv run alembic upgrade head                                # apply migrations
#   docker compose -f deploy/docker-compose.dev.yml down -v    # stop and DELETE the data
#
# Values can be overridden in deploy/.env (see deploy/.env.example). The defaults match
# the controller's DatabaseSettings defaults, so no extra configuration is needed.
# The port is bound to 127.0.0.1 only: the dev database is never exposed on the LAN
# (CLAUDE.md section 9).
name: meshforge-dev

services:
  postgres:
    # Pinned minor + Alpine release so every developer and CI run the same server.
    image: postgres:16.15-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MESHFORGE_DEV_DB_NAME:-meshforge}
      POSTGRES_USER: ${MESHFORGE_DEV_DB_USER:-meshforge}
      POSTGRES_PASSWORD: ${MESHFORGE_DEV_DB_PASSWORD:-meshforge-dev}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --auth-host=scram-sha-256"
    # Server default timezone UTC (the controller also sets it per connection).
    command: ["postgres", "-c", "timezone=UTC"]
    ports:
      - "127.0.0.1:${MESHFORGE_DEV_DB_PORT:-5432}:5432"
    volumes:
      - meshforge-pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 (TCP): the entrypoint's temporary init server listens on the unix
      # socket only, so this does not report healthy before initialisation finishes.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  meshforge-pgdata:
