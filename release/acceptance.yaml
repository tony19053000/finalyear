# V1.0 acceptance manifest (D407, ADR-0023). One row per success criterion of every
# roadmap version below V1.0 (V0.1-V0.17, deferred versions included).
#
#   id           <version>-c<criterion number>, e.g. V0.6-c2
#   text         the roadmap criterion, verbatim (the coverage test compares it, so a
#                reworded criterion forces a re-review of its row)
#   kind         auto   - evidence.tests (pytest node ids) and optional evidence.commands
#                         (repo scripts, run with the release interpreter) are run by
#                         scripts/release_check.py; evidence.flags opt into slow/chaos/perf
#                lab    - evidence.section is a V1.0 lab campaign section (L0-L5, brief
#                         §4); the verdict arrives as an evidence JSON in lab/reports/raw/
#                         (`release_check.py record-lab` writes one); evidence.tests are
#                         supporting harness tests, collected by the coverage test, not run
#                waiver - not proven in v1.0: reason + decision (ADR-NNNN / DNNN) required
#   affected_by  source globs (fnmatch: `*` also crosses `/`). For lab rows, evidence
#                recorded at an older SHA stays valid only if no file matching these
#                globs changed since (D406 redo rule).
#
# Gate: tests/unit/release/test_manifest_coverage.py. Runner: scripts/release_check.py.

schema: meshforge.acceptance/1

lab_sections:
  L0: 'Hardware + network: inventory of all 4 laptops, GPU stack, switch/DHCP/Private profile, iperf matrix
    (folds in 0.2.2-0.2.5, 0.2.11)'
  L1: 'Fresh install of rc.N: controller .deb, Linux agents, Windows installer timed, join by code + QR,
    upgrade rc.N-1 -> rc.N, uninstall verify, reinstall (folds in 0.17.8, SP1/SP3 labs, 0.3.2/0.3.13 Windows
    checks, Q21 DB import)'
  L2: 'Functional acceptance on the installed build: fabric, Mode 1 examples on each laptop (incl. GPU
    job), datasets Wi-Fi + Ethernet, pairing/revoke/Wireshark, dashboard visual review, Mode 3 with a
    node killed (folds in 0.3.15, 0.4.15, 0.4.8, 0.5.11, 0.7.12, 0.8.10, 0.10.10)'
  L3: 72 h soak + chaos (D409-D411) on mains power, sleep disabled (folds in 1.0.2, 0.6.13, the V0.3 24
    h soak criterion)
  L4: 'Evaluation runs: overnight data campaign (also trains/validates ML), then the policy matrix + live
    ablations (folds in 0.9.10, 0.14.8, 0.15.11, 1.0.6)'
  L5: Demo rehearsal x2, fallback recordings (folds in 1.0.7)

