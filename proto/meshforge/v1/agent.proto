// Controller <-> agent control plane (ARCHITECTURE §20, ADR-0002).
//
// Each agent dials OUT to the controller and holds one long-lived bidirectional
// stream. Agent -> controller: AgentMessage; controller -> agent:
// ControllerMessage. Both are envelopes with a `payload` oneof.
//
// Delivery semantics (ARCHITECTURE §13): at-least-once, exactly-once effect.
// Every envelope carries a unique `message_id`; for ControllerMessage it is the
// command ID the agent deduplicates on. Receipts flow both ways with the same
// Ack message (ADR-0002): the controller acks agent reports so the agent can
// drop them from its reconnect buffer, and the agent acks controller commands
// so the controller stops re-sending them.
//
// Fencing: every payload that refers to an attempt (has `attempt_id`) also
// carries that attempt's `fencing_token` (enforced by tests/unit/test_protos.py).
//
// Session fencing (ADR-0002 Updates 2026-09-20, roadmap 0.3.1):
// - The agent persists a `session_epoch` counter with its identity (ADR-0013),
//   increments it before every new stream and sends it in Hello. The controller
//   keeps at most one live session per node_id: a Hello with a HIGHER epoch than
//   the live session's closes that older stream (a zombie); a LOWER or EQUAL
//   epoch is rejected with HelloAck{accepted=false, reject_code=STALE_EPOCH}.
//   Epochs are never compared across node_ids.
// - The controller answers Hello with HelloAck{session_id, heartbeat_interval_ms,
//   lease_ms}. Both sides put that session_id in envelope field 3 of every
//   later message; a message carrying another session's id is dropped and
//   counted, never processed. Intervals are controller-owned.
// - After a reconnect the agent sends Reconcile{replay_from_sequence} and
//   replays its bounded ring of un-acked reports; the controller dedupes on
//   message_id. Heartbeats are never buffered or replayed.
// - Liveness (ARCHITECTURE §12.3) is measured on the controller's monotonic
//   clock; the Timestamps in Heartbeat/HelloAck are for RTT and display only.
//
// Roadmap coverage: 0.1.5 envelopes/oneofs; 0.3.1 session/liveness/resource
// payloads; 0.3.4 hardware scores; 0.4.6 attempt execution (ExecutionSpec,
// AttemptStatus results). TODO(V0.4 G5): LogChunk flow. V0.5: CacheReport (D101), peer endpoint/key (D98/D99), G5: GcRequest, PrepareEnv/PrepareEnvStatus, InputTree, TransferSummary. TODO(V0.6): network probes for scheduling.
syntax = "proto3";

package meshforge.v1;

import "google/protobuf/timestamp.proto";
import "meshforge/v1/common.proto";

service AgentControl {
  // One stream per connected agent. Opened by the agent.
  rpc Session(stream AgentMessage) returns (stream ControllerMessage);
  // V0.7 G4 (roadmap 0.7.7b, D140): a new node certificate for the caller,
  // identified ONLY by the mutual-TLS client certificate of this call. The
  // CSR must name that node in this fabric and be signed by its key (a new key
  // = `meshforge-agent rotate-key`). The new certificate is "pending" until
  // the node's first Hello with it; only then is the old serial superseded,
  // so a renewal never cuts the live session. Refusals: gRPC status +
  // trailing `meshforge-reason` (csr_<pki reason>, renew_node_mismatch,
  // node_revoked, cert_superseded, rate_limited, unavailable, internal).
  rpc RenewCertificate(RenewCertificateRequest) returns (RenewCertificateResponse);
}

message RenewCertificateRequest {
  // PEM CSR (<= 4096 bytes), SAN URI meshforge://fabric/<fabric_id>/node/<node_id>.
  bytes csr_pem = 1;
}

message RenewCertificateResponse {
  bytes node_cert_pem = 1;
  // The fabric CA (unchanged; the agent checks it equals its pinned ca.crt).
  bytes ca_cert_pem = 2;
}

// ---------------------------------------------------------------------------
// Envelopes
// ---------------------------------------------------------------------------

// Agent -> controller.
message AgentMessage {
  // Unique per message (ULID); echoed back in Ack.acked_message_id.
  string message_id = 1;
  google.protobuf.Timestamp sent_at = 2;
  // Session this message belongs to (from HelloAck). Empty only on Hello itself.
  // Messages for a session the receiver does not own are dropped (see header).
  string session_id = 3;

  // Payload numbers start at 10 so envelope metadata can grow in 4..9.
  oneof payload {
    Hello hello = 10;
    Reconcile reconcile = 11;
    Heartbeat heartbeat = 12;
    ResourceUpdate resource_update = 13;
    CacheReport cache_report = 14;
    NetProbeResult net_probe_result = 15;
    AttemptStatus attempt_status = 16;
    LogChunk log_chunk = 17;
    // Receipt for a ControllerMessage command (acked_message_id = its message_id).
    Ack ack = 18;
    // Reply to a controller Ping (roadmap 0.3.10); never buffered or replayed.
    Pong pong = 19;
    // A completed hardware-score run (roadmap 0.3.4, brief §5g D37). A report:
    // buffered, replayed after a reconnect and acked like ResourceUpdate.
    HardwareScores hardware_scores = 20;
    // The agent's LAST message on a stream it closes on purpose (V0.4 D40): the
    // controller ends the session agent_closed on receipt (node -> OFFLINE now).
    // Never buffered, replayed or acked. Any stream end without a prior Goodbye
    // is stream_lost (node -> SUSPECT, OFFLINE at the lease edge).
    Goodbye goodbye = 21;
    // Progress / result of a PrepareEnv command (V0.5 G5, roadmap 0.5.8). A
    // report: buffered, replayed after a reconnect and acked.
    PrepareEnvStatus prepare_env_status = 22;
    // The owner changed this node's policy live (V0.7 G5, D142: `meshforge-agent
    // policy set`). A report: buffered, replayed after a reconnect and acked.
    // The newest one wins; the next Hello carries the policy again.
    PolicyUpdate policy_update = 23;
    // V0.10 G4 (D263): Mode 3 lanes. ChunkRequest and LeaseRenew are never
    // buffered, replayed or acked (a lost one is simply sent again);
    // ChunkResult is a report: buffered, replayed after a reconnect and acked
    // only once the controller stored it.
    ChunkRequest chunk_request = 24;
    ChunkResult chunk_result = 25;
    LeaseRenew lease_renew = 26;
  }
}

// Controller -> agent.
message ControllerMessage {
  // Unique per message (ULID); the command ID the agent deduplicates on.
  string message_id = 1;
  google.protobuf.Timestamp sent_at = 2;
  // Session this message belongs to (from HelloAck). Empty only on HelloAck.
  // The agent drops commands for a session it no longer owns (see header).
  string session_id = 3;

  oneof payload {
    StartAttempt start_attempt = 10;
    CancelAttempt cancel_attempt = 11;
    ProbeRequest probe_request = 12;
    PrepareEnv prepare_env = 13;
    GcRequest gc = 14;
    Ack ack = 15;
    // Reply to Hello; the first message on every stream from the controller.
    HelloAck hello_ack = 16;
    // RTT probe (roadmap 0.3.10); the agent answers with Pong{same ping_id}.
    Ping ping = 17;
    // A fresh fetch token for an attempt the agent still holds (V0.5, D95):
    // sent after Reconcile when this controller process has no live token for
    // a held attempt that may still be fetching (a controller restart forgets
    // every token - they are never persisted).
    RefreshFetchToken refresh_fetch_token = 18;
    // A fresh upload grant for an attempt the agent still holds (V0.6 G1,
    // D114): sent after Reconcile when this controller process has no grant
    // for it (a restart forgets every grant - they are never persisted).
    RefreshUploadGrant refresh_upload_grant = 19;
    // Fresh peer tokens for an attempt that is still staging (V0.7 G3, D147):
    // peer tokens live at most 60 s, so the controller re-mints them while
    // the attempt stages; a long transfer uses the newest token for every
    // range it asks, never a longer-lived token.
    RefreshPeerTokens refresh_peer_tokens = 20;
    // The fabric's revocation set changed (V0.7 G3, D138): the agent's peer
    // server refuses these client certificate serials from now on. Re-sent
    // on a missing Ack (D113); every HelloAck carries the full set too.
    RevocationUpdate revocation_update = 21;
    // V0.10 G4 (D263): the answers to a lane's ChunkRequest, and the stop of
    // one chunk (a superseded copy, a cancelled job). Commands: acked by the
    // agent, never re-sent by a timer (the lane asks again).
    ChunkGrant chunk_grant = 22;
    NoWork no_work = 23;
    CancelChunk cancel_chunk = 24;
  }
}

// ---------------------------------------------------------------------------
// Agent -> controller payloads
// ---------------------------------------------------------------------------

// First message on every stream.
message Hello {
  string node_id = 1;
  // Must be set; the controller accepts a configured range of versions and
  // rejects PROTOCOL_VERSION_UNSPECIFIED and anything outside that range.
  ProtocolVersion protocol_version = 2;
  // meshforge package version of the agent (PEP 440 string).
  string agent_version = 3;
  string hostname = 4;
  // Agent-monotonic stream counter persisted with the identity (ADR-0013);
  // incremented before every new stream. See header "Session fencing".
  uint64 session_epoch = 5;
  // Operating system, e.g. "Ubuntu 24.04", "Windows 11".
  string os = 6;
  // Normalised platform tag, e.g. "linux-x86_64", "windows-amd64".
  string platform = 7;
  // Static hardware inventory (roadmap 0.3.3); dynamic usage is ResourceUpdate.
  HardwareSummary hardware = 8;
  // The agent's cached hardware scores when they are valid for this machine's
  // current fingerprint (roadmap 0.3.4, D37), so a controller restart never loses
  // them. Absent = "not measured for this hardware": the controller clears what
  // it stored and shows the scores as pending.
  HardwareScores hardware_scores = 9;
  // "host:port" the agent's peer blob server listens on (V0.5 D97/D99); empty =
  // no peer server. The controller accepts it only when host equals the address
  // the session comes from (or [controller] trust_peer_endpoints) and 1 <= port
  // <= 65535; otherwise it is ignored (logged), never an admission failure.
  string peer_endpoint = 10;
  // Slots (V0.6 D105): how many jobs of each kind the owner lets this node run
  // at once ([agent.execution] max_cpu_jobs / max_gpu_jobs). Absent = not said
  // (an older agent): the controller assumes 1 CPU slot, and 1 GPU slot only
  // with the exec-gpu capability. 0 = no jobs of that kind. The controller
  // ignores a value above 64 (logged) and caps the total per node with its own
  // [controller.jobs] max_attempts_per_node.
  optional uint32 max_cpu_jobs = 11;
  optional uint32 max_gpu_jobs = 12;
  // The owner's policy (V0.7 G5, D142). Absent = an agent from before G5: the
  // controller assumes an open policy (its agent enforces what it enforces). A
  // present but malformed or oversized policy is refused as a whole: the node
  // is treated as accepting nothing (fail closed), never trusted partially.
  OwnerPolicy policy = 13;
  // V0.7 G3: node identity is proven by the client certificate (mTLS); node_id
  // must equal the certificate's.
}

// The node owner's policy (V0.7 G5, roadmap 0.7.8, D142). The agent is
// authoritative: it re-checks every StartAttempt against its current policy;
// the controller's planner uses this copy to avoid sending what would be
// refused. See common/owner_policy.py for the rule both sides apply.
message OwnerPolicy {
  bool accept_jobs = 1;
  // Stored and advertised now; Remote-GPU sessions use it from V0.11.
  bool accept_gpu_sessions = 2;
  // Per-job limits; absent = no owner limit.
  optional uint64 max_ram_bytes = 3;
  // 1..100: share of the node's CPU threads one job may use.
  optional uint32 max_cpu_percent = 4;
  optional uint64 max_vram_bytes = 5;
  bool allow_unsandboxed = 6;
  // A job asking `limits.network: on` may get a network (D143).
  bool allow_network = 7;
  // User names whose jobs the node runs; empty = everyone (<= 64 names).
  repeated string allowed_users = 8;
  // "<field>:<why>" caps this OS/runtime cannot enforce with a runtime limit
  // (e.g. "max_vram_bytes:no_runtime_limit"); <= 16 entries.
  repeated string not_enforced = 9;
  // Agent-local counter, +1 per live change (logs only).
  uint64 revision = 10;
  // V0.9 G5 (D219/D246): the owner paused benchmark jobs on this node
  // (`meshforge-agent bench pause`). User jobs are not affected. Default
  // false, so an agent from before G5 keeps running benchmarks.
  bool pause_benchmarks = 11;
}

// A live policy change (V0.7 G5). Slots travel with it: they are owner
// policy too (max_cpu_jobs / max_gpu_jobs, same meaning as in Hello).
message PolicyUpdate {
  OwnerPolicy policy = 1;
  optional uint32 max_cpu_jobs = 2;
  optional uint32 max_gpu_jobs = 3;
}

// Static hardware inventory sent in Hello (roadmap 0.3.3). Filled by the
// agent's hardware discovery; the controller stores it in the node registry.
message HardwareSummary {
  string cpu_model = 1;
  uint32 cpu_cores = 2;
  uint32 cpu_threads = 3;
  uint64 ram_bytes = 4;
  message Gpu {
    // NVML device index; matches GpuUsage.index in ResourceUpdate.
    uint32 index = 1;
    string model = 2;
    uint64 vram_bytes = 3;
    string driver_version = 4;
    // CUDA compute capability as "major.minor", e.g. "8.6".
    string compute_capability = 5;
  }
  repeated Gpu gpus = 5;
  // Free-form capability tags the planner can filter on, e.g. "docker",
  // "cuda", "nvidia-container-toolkit".
  repeated string capabilities = 6;
}

// ---------------------------------------------------------------------------
// Hardware scores (roadmap 0.3.4, brief §5g D31/D36-D38)
// ---------------------------------------------------------------------------
//
// One scoring run of one node: a fixed, small metric set measured by the agent
// in a child process. Every Score is either a measured value WITH its conditions
// (SCORE_STATUS_OK: mean, stdev, n >= 5, backend, threads) or a typed "not
// measured, because ..." (UNAVAILABLE / FAILED + reason) - never a 0.0 standing
// in for "unknown". The controller validates every field at ingestion (finite,
// non-negative numbers; bounded counts; printable bounded strings; known enum
// values) and DROPS an invalid set (logged, counted) - it never closes the
// stream over it. Enum value 0 is never valid.

enum ScoreMetric {
  SCORE_METRIC_UNSPECIFIED = 0;
  // Host metrics (no gpu_index).
  SCORE_METRIC_CPU_FP32_GFLOPS_1T = 1;
  SCORE_METRIC_CPU_FP32_GFLOPS_ALL = 2;
  SCORE_METRIC_CPU_FP64_GFLOPS_ALL = 3;
  SCORE_METRIC_MEM_TRIAD_GB_S = 4;
  // Per-GPU metrics (gpu_index = HardwareSummary.Gpu.index, the NVML index).
  SCORE_METRIC_GPU_FP32_TFLOPS = 5;
  SCORE_METRIC_GPU_FP16_TFLOPS = 6;
  SCORE_METRIC_GPU_MEM_GB_S = 7;
}

enum ScoreStatus {
  SCORE_STATUS_UNSPECIFIED = 0;
  // Measured: mean/stdev over n >= 5 repetitions.
  SCORE_STATUS_OK = 1;
  // This machine cannot measure it (no BLAS, no torch, no usable CUDA).
  SCORE_STATUS_UNAVAILABLE = 2;
  // A measurement was attempted and broke (timeout, crash, device mismatch).
  SCORE_STATUS_FAILED = 3;
}

message Score {
  ScoreMetric metric = 1;
  // Set for GPU metrics only.
  optional uint32 gpu_index = 2;
  ScoreStatus status = 3;
  // Set only when status == SCORE_STATUS_OK (unit implied by the metric).
  optional double mean = 4;
  optional double stdev = 5;
  // Measured repetitions (0 when not OK).
  uint32 n = 6;
  // e.g. "numpy", "torch"; unset when no backend was involved.
  optional string backend = 7;
  optional string backend_version = 8;
  optional uint32 threads_effective = 9;
  // The backend could not use the whole machine: the value is a lower bound.
  bool lower_bound = 10;
  // Unset when the run was too short to judge, or the metric is not OK.
  optional bool throttling_suspected = 11;
  // Stable snake_case code; set exactly when status != SCORE_STATUS_OK
  // (e.g. "torch_not_installed", "timeout", "device_mismatch").
  string reason = 12;
  // Human-readable context for a non-OK status; no paths, no secrets.
  string detail = 13;
}

message ScoreConditions {
  // Unset = unknown (no battery API or no battery information).
  optional bool on_battery = 1;
  // Machine-wide CPU %, 0..100, over the ~2 s before the first case.
  optional double cpu_load_percent_before = 2;
  optional bool background_load_high = 3;
  // The benchmark child ran at lowered OS priority.
  bool priority_lowered = 4;
  double budget_s = 5;
  double duration_s = 6;
  // The total budget ran out before every planned case finished.
  bool budget_exhausted = 7;
}

message HardwareScores {
  // score_<ULID>; unique per run.
  string run_id = 1;
  // Agent wall clock when the run finished. The controller keeps the newest
  // run: a report older than the stored one is ignored (replay-idempotent).
  google.protobuf.Timestamp measured_at = 2;
  // Bumped by the agent when a kernel or formula changes.
  uint32 score_version = 3;
  // SHA-256 hex of the hardware/software inputs the run is valid for.
  string fingerprint = 4;
  ScoreConditions conditions = 5;
  repeated Score scores = 6;
}

// An agent's announced, orderly end of its stream (V0.4 D40). See the payload
// comment in AgentMessage. Carries the session_id of the stream it ends (envelope
// field 3); a Goodbye for another session is dropped like any stale message.
message Goodbye {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    // The agent process was asked to stop (signal, service stop, CLI).
    REASON_SHUTDOWN = 1;
  }
  Reason reason = 1;
  // Human-readable context for logs. Bounded (the controller refuses more than
  // 256 characters) and printable; never secrets or paths.
  string detail = 2;
}

// Sent after (re)connect: what the agent is still running, so the controller
// can rebuild state and fence stale attempts (ARCHITECTURE §13).
message Reconcile {
  repeated AttemptStatus running_attempts = 1;
  // First `sequence` of the buffered reports the agent is about to replay
  // (ADR-0002 Updates §4); 0 when nothing is replayed.
  uint64 replay_from_sequence = 2;
}

message Heartbeat {
  // Monotonic per stream; lets the controller detect gaps.
  uint64 sequence = 1;
  // Agent wall clock when the heartbeat was sent; used only for RTT/clock-skew
  // measurement (roadmap 0.3.10), never for liveness (monotonic clock, see header).
  google.protobuf.Timestamp agent_time = 2;
  // V0.9 G5 (D219/D246): the owner is using this laptop (input idle time
  // below [agent.bench] idle_threshold_s, or CPU of non-fabric processes above
  // [agent.bench] foreground_cpu_percent), with hysteresis. Only this bit and
  // a short reason of ours leave the node - never what the owner does. The
  // controller dispatches no benchmark job here while it is set.
  bool owner_active = 3;
  // "idle" / "cpu" / "" (<= 32 characters).
  string owner_active_reason = 4;
  // Where input idle time came from: "logind", "windows", or "unknown" (then
  // only the CPU rule applies). "" = the monitor is off.
  string idle_source = 5;
}

// Dynamic resource usage (roadmap 0.3.5). Sent on change beyond a threshold
// or at least every few seconds; the controller keeps a live ring and a
// downsampled history (roadmap 0.3.11).
message ResourceUpdate {
  google.protobuf.Timestamp observed_at = 1;
  // Whole-machine CPU utilisation, 0..100.
  double cpu_percent = 2;
  uint64 ram_used_bytes = 3;
  uint64 ram_total_bytes = 4;
  message GpuUsage {
    // NVML device index; matches HardwareSummary.Gpu.index.
    uint32 index = 1;
    // GPU utilisation, 0..100.
    double util_percent = 2;
    uint64 vram_used_bytes = 3;
    uint64 vram_total_bytes = 4;
  }
  repeated GpuUsage gpus = 5;
  message DiskUsage {
    // Mount point (POSIX) or drive root (Windows, e.g. "C:\\").
    string mount = 1;
    uint64 free_bytes = 2;
    uint64 total_bytes = 3;
  }
  repeated DiskUsage disks = 6;
  // Monotonic per stream, independent of Heartbeat.sequence; replayed after a
  // reconnect (Reconcile.replay_from_sequence) and deduped by the controller.
  uint64 sequence = 7;
}

// What a node holds in its caches (V0.5 D90/D100/D101). A report: buffered,
// replayed after a reconnect and acked like ResourceUpdate. After every
// accepted Hello the agent sends a paged SNAPSHOT (snapshot=true on every page,
// snapshot_last=true on the final one), then deltas (snapshot=false). The
// controller replaces the node's rows on the first snapshot page of a new
// session and applies deltas only after snapshot_last. A delta that arrives
// before it is dropped; one with a gap in `seq` marks the node's index stale
// until the agent's next snapshot (every Hello and periodically). At most 1024
// items in added + removed together; keys are validated by kind.
message CacheReport {
  // Monotonic per agent PROCESS (never reset by a reconnect), > 0: a report
  // replayed from an earlier session of the same process is recognisably old.
  uint64 seq = 1;
  // This message is a page of a full snapshot (added = what is held now).
  bool snapshot = 2;
  // The final page of the snapshot; deltas follow.
  bool snapshot_last = 3;
  repeated CacheItem added = 4;
  // Always empty on a snapshot page.
  repeated CacheItem removed = 5;
  // V0.5 G4 fix round 2 (additive): index of this page within its snapshot,
  // 0 = the first page; 0 on a delta. Only page 0 starts (replaces) a
  // snapshot, so a session whose first report is the TAIL of a snapshot (its
  // head acked on an earlier session) never goes live with partial rows - the
  // D101 fields alone cannot tell a first page from a tail after a loss.
  // `optional` (fix round 3): an agent that predates the field sends none, and
  // "absent" must not read as "page 0" - the controller then accepts only a
  // single-page snapshot; a multi-page one makes the node stale (logged).
  optional uint32 page = 6;
}

// One cached thing (V0.5 D100).
message CacheItem {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // A CAS blob; key "sha256:<64 hex>".
    KIND_BLOB = 1;
    // A complete tree: the manifest and every member blob are in the CAS;
    // key = tree_id "sha256:<64 hex>".
    KIND_TREE = 2;
    // A built environment; key = env hash (64 hex).
    KIND_ENV = 3;
    // A container image the agent built or pinned; key "sha256:<64 hex>" image id.
    KIND_IMAGE = 4;
  }
  Kind kind = 1;
  string key = 2;
  // Bytes on disk (0 when unknown).
  uint64 size = 3;
}

// The answer to a ProbeRequest (V0.6 G4, D111): what this node measured
// downloading from the target's peer server. A report: buffered, replayed after
// a reconnect and acked. ok = false -> `error` names why (a stable code) and the
// numbers are 0; `bytes` is still what was transferred (the probe budget).
message NetProbeResult {
  string probe_id = 1;
  string target_node_id = 2;
  bool ok = 3;
  // Median of the 0-byte request round trips (ms).
  double rtt_ms = 4;
  // Throughput of the largest timed download (bytes/s).
  double bw_bytes_s = 5;
  // Every body byte received during the probe.
  uint64 bytes = 6;
  // Wall time of the whole probe (s).
  double duration_s = 7;
  string error = 8;
}

// One attempt state change, reported by the agent through send_report (buffered,
// replayed after a reconnect, acked). The controller applies it idempotently on
// (attempt_id, fencing_token, state) and drops a report whose fencing_token is not
// the attempt's current one (counted as `fenced`). V0.4 D52/D67/D68.
message AttemptStatus {
  string job_id = 1;
  string attempt_id = 2;
  // Monotonic attempt epoch; the controller rejects reports with a stale token.
  uint64 fencing_token = 3;
  AttemptState state = 4;
  // Set only when state == ATTEMPT_STATE_FAILED.
  Failure failure = 5;
  google.protobuf.Timestamp observed_at = 6;
  // The workload's exit code, once it exited (absent: it never ran, or its status
  // could not be read). On an env_error "setup_failed" it is the setup step's.
  optional int32 exit_code = 7;
  // Agent-measured phase durations (monotonic clock). Sent in the terminal status;
  // an absent field means the phase never ran (the controller records it skipped).
  PhaseTimings phases = 8;
  // "sha256:<64 hex>" of the packed outputs (V0.4 G5); empty until then.
  string output_digest = 9;
  // Declared outputs (manifest `outputs`) that matched nothing (bounded). Not an
  // error: listed so the user sees it (D54).
  repeated string missing_outputs = 10;
  // Runtime that ran (or was chosen to run) the attempt: "docker" | "venv" | "subprocess".
  string runtime = 11;
  // Signal number that ended the workload, when it died by one.
  optional int32 signal = 12;
  // The attempt's complete local logs, uploaded with its upload grant in the
  // terminal status (V0.4 G5, D71). Absent: not uploaded (stopped attempt, empty
  // log, upload failed) - the controller keeps its live copy then.
  FinalLog stdout_log = 13;
  FinalLog stderr_log = 14;
  // Transfer telemetry (V0.5 G5, D93): one entry per staged tree (the project
  // tree first, then named inputs), sent with the terminal status. At most
  // 1 + 16 entries; the controller persists them as transfer_event rows.
  repeated TransferSummary transfers = 15;
  // The environment the runtime resolved or tried to build (V0.6 G1, D116):
  // 64 lowercase hex of the agent's env hash, empty when none was computed.
  // Terminal statuses only. An env_error with a hash makes the controller
  // remember (node, env) as known-bad for [controller.jobs] env_bad_ttl_s.
  string env_hash = 16;
  // V0.9 G1 (D212): a benchmark's own report (results/workload.json); absent
  // for any other job. Terminal statuses only.
  WorkloadReport workload = 17;
  // V0.9 G4 (D217): what the agent did with StartAttempt.condition (terminal
  // statuses only; absent when the attempt had none).
  ConditionReport condition = 18;
}

// The outcome of a benchmark condition on the agent (V0.9 G4).
message ConditionReport {
  // The canonical condition string it applied (echoes BenchCondition.spec).
  string spec = 1;
  // Applied and verified (measured values within the condition's bound).
  bool verified = 2;
  // What was measured, a JSON object (<= 2048 characters), e.g.
  // {"cores":2,"load_cores":1.97,"window_s":2.0}. "" = nothing measured.
  string measured_json = 3;
  // Why it could not be applied or verified; "" when verified.
  string reason = 4;
  // The condition was reverted cleanly at the attempt's end (false: the
  // revert failed and the marker keeps it for the next start's sweep).
  bool reverted = 5;
}

// What staging one tree cost (V0.5 G5, D93). Agent-measured, monotonic clock.
message TransferSummary {
  // "sha256:<64 hex>" of the staged tree.
  string tree_id = 1;
  // Blobs (and their bytes) that were already in the agent's cache: hits.
  uint32 blobs_hit = 2;
  uint64 bytes_hit = 3;
  // Blobs fetched now (misses) and the payload bytes received for them.
  uint32 blobs_fetched = 4;
  uint64 bytes_fetched = 5;
  // Chunks a previous interrupted fetch had already verified (not re-sent).
  uint32 chunks_resumed = 6;
  // Whole blobs fetched again after a corrupt copy was found.
  uint32 corrupt_refetches = 7;
  // The tree manifest came from the cache.
  bool manifest_hit = 8;
  // Fetch + verify + copy into the workdir.
  double duration_s = 9;
  // Per source (at most 17: the controller + 16 peers).
  repeated TransferSource sources = 10;
}

// One blob source's share of a tree's transfer (V0.5 D89/D93).
message TransferSource {
  // The holder's node_id; empty = the controller.
  string node_id = 1;
  // Payload bytes received from it (wasted end-game duplicates included).
  uint64 bytes = 2;
  // Time spent in requests to it (overlapping requests add up).
  double duration_s = 3;
  // Units (chunks or whole blobs) it won.
  uint32 units = 4;
  uint32 failures = 5;
  // Why it was dropped for this transfer (a failure_type value); empty = kept.
  string dropped = 6;
}

// One stream's final log (D71).
message FinalLog {
  // "sha256:<64 hex>" of the uploaded log blob; empty = not uploaded.
  string digest = 1;
  // Bytes of workload output kept (the cap stops the file growing).
  uint64 bytes = 2;
  // The workload wrote more than the per-stream cap; the rest was dropped and a
  // marker line says so at the end of the log.
  bool truncated = 3;
}

// Durations in seconds on the agent's monotonic clock (ARCHITECTURE §17, D68).
message PhaseTimings {
  // Bundle fetch + digest check + unpack.
  optional double stage_s = 1;
  // Image pull + requirements install (the runtime's env phase).
  optional double env_s = 2;
  // Workload start to exit.
  optional double run_s = 3;
  // Workload exit to the terminal report (output packing/upload from G5 on).
  optional double collect_s = 4;
  // V0.9 G1 (D213): the workload's own kernel time in nanoseconds, measured by
  // the workload with a monotonic clock and read by the agent from its
  // results/workload.json (benchmark jobs). Absent for every other job.
  optional uint64 compute_ns = 5;
}

// V0.9 G1 (D212): what a benchmark job said about itself in
// results/workload.json, read once by the agent after the workload exited
// (bounded, untrusted: the workload wrote it). Terminal statuses only.
message WorkloadReport {
  // Family name, e.g. "cpu.matmul" (<= 64 chars, [a-z0-9_.-]); "" = unreadable.
  string family = 1;
  // The parameters as canonical JSON (sorted keys, compact; <= 4096 chars);
  // "" = absent or too large.
  string params_json = 2;
  optional uint64 seed = 3;
  // "ok" | "check_failed" | "unavailable" | "bad_params".
  string status = 4;
  // "cpu" | "cuda" | "" (not run).
  string device = 5;
  // results/workload.json schema_version (0 = absent).
  uint32 result_schema_version = 6;
  // How many iterations compute_ns covers (D225/D228: compute_ns is the whole
  // timed loop; one iteration = compute_ns / compute_iterations). Unset = not
  // run or not reported. 1..100000 (the largest loop parameter of a family).
  optional uint32 compute_iterations = 7;
}

// Live log bytes (D71): best-effort, never buffered or replayed, never acked.
// `offset` is the byte position of `data` in the attempt's stream on the agent;
// a chunk dropped on the way shows up as a jump (a gap the controller records).
message LogChunk {
  string job_id = 1;
  string attempt_id = 2;
  enum Stream {
    STREAM_UNSPECIFIED = 0;
    STREAM_STDOUT = 1;
    STREAM_STDERR = 2;
  }
  Stream stream = 3;
  // Byte offset of `data` within the stream, for dedupe after reconnect.
  uint64 offset = 4;
  bytes data = 5;
  // Attempt epoch; logs from a fenced (superseded) attempt are dropped.
  uint64 fencing_token = 6;
}

// ---------------------------------------------------------------------------
// Controller -> agent payloads
// ---------------------------------------------------------------------------

// Run one attempt (V0.4 D52/D67). The agent dedupes on (attempt_id,
// fencing_token), not only on message_id: the controller resends the SAME
// attempt after a reconnect or its own restart (D66), with a new message_id.
message StartAttempt {
  string job_id = 1;
  string attempt_id = 2;
  uint64 fencing_token = 3;
  ExecutionSpec spec = 4;
  // V0.7 G6 (D144): the values of the job owner's secrets the manifest names
  // (ExecutionSpec.manifest_json "secrets"), one entry per name. Sent only on a
  // mutually authenticated (mTLS) session - never in insecure-dev unless
  // [security] allow_insecure_secrets. The agent holds them in memory and in
  // the attempt's private secret files only; never logged, never persisted,
  // wiped when the attempt ends.
  repeated JobSecret secrets = 5;
  // V0.9 G4 (D217/D241): the benchmark condition of this attempt; absent for
  // every other job (and for conditions the controller applies itself, e.g.
  // queue). The agent applies it BEFORE staging, verifies it (an unverified
  // condition fails the attempt config_error "condition_failed:..." - nothing
  // runs, the run is never labelled), and reverts it when the attempt ends,
  // on every path (done, failure, cancel, agent stop; a persisted marker is
  // swept at the next agent start after a crash). The agent re-validates the
  // string and refuses a kind it did not advertise.
  BenchCondition condition = 6;
  // V0.9 G5 (D219/D246): this attempt is a benchmark job (a campaign run, a
  // queue filler or a cache warm-up). The agent refuses it - and stops it if
  // it runs - while the owner paused benchmarks or is using the laptop
  // (failure owner_preempted); it never stops a job without this flag.
  bool benchmark = 7;
  // V0.10 G4 (D259): present = this attempt is a LANE of a Mode 3 (split)
  // job. The agent stages the project and builds the env once, then pulls
  // chunks (ChunkRequest) and runs the entrypoint once per chunk. An agent
  // that does not know this field never gets a lane: the controller places
  // lanes only on nodes advertising the "exec-split" capability.
  LaneSpec lane = 8;
  // V0.10 G5 (D268/D283): present = this attempt is the COMBINE of a split
  // job: it fetches every chunk's committed result (the parts index, chunk
  // order), unpacks them read-only as parts/NNNNN in an agent-owned folder
  // outside any workdir, runs the built-in (concat, merge-csv, merge-json:
  // trusted agent code in its own process) or the user's combine script
  // (sandboxed like any job, project staged), and reports the packed out/
  // folder as the attempt's (= the job's) output. Placed only on nodes that
  // advertise "exec-split" (agents of this version run both lanes and
  // combines).
  CombineSpec combine = 9;
}

// A split job's combine (V0.10 G5, D268).
message CombineSpec {
  // "sha256:<64 hex>" of the parts index blob (common/split_chunks.py:
  // every chunk's result digest in chunk order). The attempt's fetch token
  // may read it and every part it names; the agent verifies every digest.
  string parts_digest = 1;
  // Chunks in the index (the agent checks the index has exactly these).
  uint32 chunk_count = 2;
}

// A lane's chunk source (V0.10 G4, D259/D263/D264).
message LaneSpec {
  // "sha256:<64 hex>" of the job's item list (the canonical JSON blob of
  // common/split_items.py, resolved once at submit). The attempt's fetch token
  // may read it; the agent verifies its digest before use.
  string items_digest = 1;
  uint32 item_count = 2;
  // Bytes one chunk's packed output may have (split.max_chunk_output_bytes);
  // more fails the chunk output_error.
  uint64 max_chunk_output_bytes = 3;
  // The lease (visibility) timeout; the agent renews its live leases every
  // third of it (LeaseRenew).
  double lease_timeout_s = 4;
}

// One benchmark condition (V0.9 G4). ``spec`` is the canonical condition
// string of common/bench_conditions.py ("cpu_load:2", "cache:cold",
// "netem:delay=50ms,loss=1%"), <= 64 characters.
message BenchCondition {
  string spec = 1;
}

// One secret value for one attempt (V0.7 G6). ``name`` follows
// common/secret_names (A-Z, 0-9, _; not starting with a digit).
message JobSecret {
  string name = 1;
  bytes value = 2;
}

// What to run and with what (V0.4 D52). Built by the controller from the job's
// canonical manifest; every field is re-validated by the agent before use.
message ExecutionSpec {
  // "sha256:<64 hex>" of the project bundle of a V0.4 bundle job. Empty for a
  // tree job (V0.5 G4: a tree job is named only by tree_id).
  string bundle_digest = 1;
  // Base URL of the blob API ("http://host:port") when the controller has an
  // advertised URL; empty = the agent uses http://<host it dialled>:<blob_port>.
  string blob_url = 2;
  // The controller's REST port, used when blob_url is empty.
  uint32 blob_port = 3;
  // Per-attempt fetch token (D48): may read exactly this attempt's digests -
  // download-only (D73). A secret: never logged, never persisted.
  string fetch_token = 4;
  // The canonical manifest JSON (common.manifest.Manifest.canonical_json()).
  string manifest_json = 5;
  // Runtime the controller asks for ("docker" | "venv" | "subprocess"); empty = the agent
  // chooses among what it offers (sandboxed first, D51). V0.4 sends empty.
  string runtime = 6;
  // 0 = the agent's default for that limit.
  uint64 memory_bytes = 7;
  double cpus = 8;
  // NVML indices of the GPUs this attempt may use (HardwareSummary.Gpu.index);
  // empty = no GPU.
  repeated uint32 gpu_indices = 9;
  // The workload's own time limit in seconds (manifest limits.timeout).
  uint32 timeout_s = 10;
  // Declared outputs (manifest `outputs`), collected in V0.4 G5.
  repeated string output_globs = 11;
  // Upload grant (V0.4 G5, D73): the only credential that may PUT blobs for this
  // attempt (outputs archive + final logs), within the two quotas below and only
  // while the attempt is live. A secret: never logged, never persisted.
  string upload_token = 12;
  uint64 upload_max_bytes = 13;
  uint32 upload_max_blobs = 14;
  // V0.5 D83: "sha256:<64 hex>" of the project's tree manifest (D81); empty = a
  // V0.4 bundle job. The agent fetches the manifest and the blobs it names into
  // its CAS, verifying every chunk and blob, then copies them into the workdir.
  string tree_id = 15;
  // Where the blobs may be fetched (V0.5 D83/D89/D100): the controller first,
  // then up to [controller.jobs] max_peer_sources ONLINE peers holding the
  // tree, each with its own signed peer token (D98). The agent fetches from all
  // of them in parallel, work-stealing.
  repeated BlobSource sources = 16;
  // Named inputs (V0.5 G5, D92), at most 16: each tree is fetched like the
  // project tree and copied READ-ONLY to its mount path inside the workdir.
  repeated InputTree inputs = 17;
  // V0.7 G5 (D142): the job owner's user name as the controller knows it
  // (empty = unknown, e.g. a legacy fabric-token job). The agent checks it
  // against [agent.policy] allowed_users; an empty name never matches a list.
  string owner_name = 18;
}

// One named input of an attempt (V0.5 D92).
message InputTree {
  // "sha256:<64 hex>" of the input's tree manifest.
  string tree_id = 1;
  // Relative POSIX path inside the workdir (validated by both sides: no "..",
  // not absolute, not overlapping the project or another input).
  string mount = 2;
  // What the manifest named ("name@version" or "name@sha256:..."), for logs.
  string ref = 3;
  // Where the input's blobs may be fetched: the controller first (the attempt's
  // fetch token, which also covers every input tree) then peers holding THIS
  // tree, each with a peer token scoped to it.
  repeated BlobSource sources = 4;
}

// One place an agent may download blobs from (V0.5 D83).
message BlobSource {
  // Base URL "http(s)://host:port"; empty = the controller at the host this agent
  // dialled and ExecutionSpec.blob_port.
  string url = 1;
  // Bearer token for that source (the attempt's fetch token for the controller).
  // A secret: never logged, never persisted.
  string token = 2;
  // The holder's node_id; empty = the controller.
  string node_id = 3;
}

// Stop an attempt (D69). `release` (V0.4 G5, D75): the controller has already
// ended this attempt (or never knew it) - stop it if it still runs, then forget
// it and free its workdir at once, without waiting for an Ack of its terminal
// report (nothing the agent reports about it will be applied).
message CancelAttempt {
  string attempt_id = 1;
  uint64 fencing_token = 2;
  string reason = 3;
  bool release = 4;
}

// Replaces the fetch token of a held attempt (V0.5, D95). Same scope as the
// token in its StartAttempt (download-only, the attempt's bundle or tree); the
// old token is not revived. The agent applies it only to the attempt with this
// (attempt_id, fencing_token) and only while it still stages; a staging that
// was refused (401) or could not reach the controller retries with it.
message RefreshFetchToken {
  string attempt_id = 1;
  uint64 fencing_token = 2;
  // A secret: never logged, never persisted.
  string fetch_token = 3;
  // Where the restarted controller serves blobs now (like ExecutionSpec fields
  // 2/3): a restart may come up on another port or advertised URL. Replaces
  // the StartAttempt's values for this attempt's controller fetches.
  string blob_url = 4;
  uint32 blob_port = 5;
  // The attempt's source list re-minted (V0.5 D98): the controller first (its
  // token = fetch_token above) then peer holders with fresh peer tokens.
  // Replaces the StartAttempt's ExecutionSpec.sources for this attempt.
  repeated BlobSource sources = 6;
  // The attempt's named inputs with their sources re-minted (V0.5 G5).
  repeated InputTree inputs = 7;
}

// Peer tokens re-minted for a staging attempt (V0.7 G3, D147). Each token
// replaces the one the attempt holds for the same (tree_id, node_id) - the
// StartAttempt's or an earlier refresh's; a pair the attempt was never given
// is ignored (the list of peers is the StartAttempt's / RefreshFetchToken's).
// Applied only to the attempt with this (attempt_id, fencing_token) while it
// has not ended. Not re-sent on a missing Ack: the next re-mint supersedes it.
message RefreshPeerTokens {
  string attempt_id = 1;
  uint64 fencing_token = 2;
  repeated PeerTokenGrant tokens = 3;
}

// Node certificate serials no plane of the fabric accepts any more (V0.7 G3,
// D138): revoked nodes and certificates superseded by a re-enrolment, whose
// certificates have not expired yet. Lower-case hex, no "0x", at most 40
// chars each; the newest first, at most 10000. Serials are only ever added
// (there is no un-revoke): the agent keeps the union of every set it got.
message RevocationUpdate {
  repeated string serials = 1;
}

// One re-minted peer token: `node_id` may be asked for the blobs of `tree_id`
// with `token` (D98 scope: this tree, this requester, this holder, this
// attempt; <= 60 s). A secret: never logged, never persisted.
message PeerTokenGrant {
  string tree_id = 1;
  string node_id = 2;
  string token = 3;
}

// Replaces the upload grant of a held attempt (V0.6 G1, D114). Same quota as
// the grant in its StartAttempt (what earlier grants of the attempt already
// stored is NOT known to a restarted controller). Applied only to the attempt
// with this (attempt_id, fencing_token) while it has not ended; an upload that
// was refused (401) or could not reach the controller retries with it,
// resuming the parts the controller already holds.
message RefreshUploadGrant {
  string attempt_id = 1;
  uint64 fencing_token = 2;
  // A secret: never logged, never persisted.
  string upload_token = 3;
  // Where the controller serves blobs now (like ExecutionSpec fields 2/3).
  string blob_url = 4;
  uint32 blob_port = 5;
}

// "ProbeLink" (V0.6 G4, D111): measure the link from `target_node_id`'s peer
// server to this node. The agent sends `rtt_samples` 0-byte GETs to
// http://<endpoint>/v1/probe?bytes=0 (median = RTT), then one GET of `bytes`
// zero bytes, and one of `max_bytes` if that took less than `fast_s`; it answers
// with NetProbeResult{same probe_id}. `token` is a controller-signed probe
// token (kind "probe", holder = target, requester = this node, <= 60 s).
// Idempotent by probe_id: a repeated probe_id is never measured twice.
message ProbeRequest {
  string probe_id = 1;
  string target_node_id = 2;
  // host:port of the target's peer server (its Hello.peer_endpoint).
  string endpoint = 3;
  string token = 4;
  uint32 rtt_samples = 5;
  uint64 bytes = 6;
  uint64 max_bytes = 7;
  double fast_s = 8;
}

// Pull base images / build environments ahead of a run (V0.5 G5, roadmap
// 0.5.8 `compute node prepare`). Idempotent: an image already present or an
// env already built is reported `hit`; the same request_id twice runs once.
// The agent answers with PrepareEnvStatus reports.
message PrepareEnv {
  // V0.1 placeholder, never sent and ignored (kept: V0.1 numbers are pinned).
  string env_hash = 1;
  // ULID chosen by the controller; echoed in every PrepareEnvStatus.
  string request_id = 2;
  // Base image names ("python-cpu", "cuda-pytorch"), pinned by digest on the
  // agent ([agent.execution.images]); at most 8.
  repeated string base_images = 3;
  // Environments to build, at most 32.
  repeated EnvSpecRequest envs = 4;
}

// One environment to build (the manifest `env` block, V0.4 D46 / V0.5 D85).
message EnvSpecRequest {
  // "python-cpu" | "cuda-pytorch".
  string base = 1;
  // Requested interpreter ("3.12"); empty = the base's / agent's default.
  string python = 2;
  // The requirements file's bytes (bounded by the agent's
  // [agent.envs] max_requirements_bytes; empty = no requirements).
  bytes requirements = 3;
  // "docker" | "venv" | "subprocess"; empty = the agent's preferred runtime.
  string runtime = 4;
}

message PrepareEnvStatus {
  string request_id = 1;
  // True on the last status of the request (every item has a final state).
  bool done = 2;
  repeated PrepareItem items = 3;
}

message PrepareItem {
  // "image" (a base image name) or "env" (index into PrepareEnv.envs).
  string kind = 1;
  string name = 2;
  // "pending" | "running" | "hit" | "pulled" | "built" | "failed".
  string state = 3;
  // Set when failed: a FailureType value and a short reason code.
  string failure_type = 4;
  string reason = 5;
  string detail = 6;
  // The env hash (envs) / image digest (images) once known.
  string key = 7;
  uint64 size_bytes = 8;
  double duration_s = 9;
}

// Garbage collection (V0.5 G5, D91).
message GcRequest {
  // Run one pass now (on top of the periodic ones).
  bool run_now = 1;
  // When set, `pinned_trees` REPLACES the node's set of pinned trees (pinned
  // named inputs: never evicted). Sent after every accepted Hello and whenever
  // a pin changes. At most 4096 entries, "sha256:<64 hex>".
  bool set_pins = 2;
  repeated string pinned_trees = 3;
}

// Reply to Hello (ADR-0002 Updates §1-2). The controller's first message on
// every stream. If `accepted` is false the controller closes the stream after
// sending it; `reject_code` says why and the agent decides whether to retry
// (STALE_EPOCH: bump epoch and reconnect; PROTOCOL_VERSION: never retry;
// UNAVAILABLE / INTERNAL: back off and retry).
message HelloAck {
  bool accepted = 1;
  // Set when accepted; both sides put it in envelope field 3 from now on.
  string session_id = 2;
  // Controller-owned liveness parameters (ARCHITECTURE §12.3, ADR-0002 §5).
  uint32 heartbeat_interval_ms = 3;
  uint32 lease_ms = 4;
  // Controller wall clock when the ack was sent (clock-skew estimate only).
  google.protobuf.Timestamp controller_time = 5;
  enum RejectCode {
    REJECT_CODE_UNSPECIFIED = 0;
    // Hello.session_epoch <= the live session's epoch for this node_id.
    REJECT_CODE_STALE_EPOCH = 1;
    // Hello.protocol_version outside the controller's supported range.
    REJECT_CODE_PROTOCOL_VERSION = 2;
    // Another stream for this node_id won a concurrent Hello race.
    REJECT_CODE_DUPLICATE_SESSION = 3;
    REJECT_CODE_INTERNAL = 4;
    // The controller could not finish the admission in time (its database is
    // slow or unreachable, V0.4 D41). Retryable: back off and try again.
    REJECT_CODE_UNAVAILABLE = 5;
  }
  // Set only when accepted == false.
  RejectCode reject_code = 6;
  // Human-readable detail for logs; must never contain secrets.
  string reject_reason = 7;
  // The controller's Ed25519 public key (raw 32 bytes) that signs peer blob
  // tokens (V0.5 D98). Set when accepted; the agent's peer server verifies
  // tokens with the key of its CURRENT session only.
  bytes peer_token_key = 8;
  // The fabric's revocation set when the session was accepted (V0.7 G3,
  // D138; same rules as RevocationUpdate.serials): a reconnecting agent
  // catches up before its peer server serves anyone.
  repeated string revoked_serials = 9;
}

// Receipt used in both directions (ADR-0002): in ControllerMessage it acks an
// AgentMessage; in AgentMessage it acks a ControllerMessage command.
message Ack {
  // message_id of the envelope being acknowledged.
  string acked_message_id = 1;
}

// ---------------------------------------------------------------------------
// Mode 3 lanes (V0.10 G4, D263, ADR-0019)
// ---------------------------------------------------------------------------
//
// A lane (an attempt with StartAttempt.lane) pulls chunks: ChunkRequest ->
// ChunkGrant (or NoWork) -> runs the chunk -> ChunkResult. Every message names
// the lane (attempt_id + fencing_token) and every chunk message its lease
// (item_id + lease_seq, the work queue's fencing pair): a message whose lane
// token or lease does not match is counted and logged by the controller and
// never applied. A chunk result is committed at most once (the first
// committed result of a chunk wins); a late one from an expired lease commits
// only while the chunk is still not done (ADR-0015).

// One lease a lane holds (work item id + its lease sequence number).
message ChunkLeaseRef {
  uint64 item_id = 1;
  uint64 lease_seq = 2;
}

// Agent -> controller: "give me up to `want` chunks". `held` lists the leases
// the lane holds now: a live lease of this lane that is not listed was lost on
// the way (a broken stream ate its grant) and is granted again first.
message ChunkRequest {
  string job_id = 1;
  string attempt_id = 2;
  uint64 fencing_token = 3;
  uint32 want = 4;
  repeated ChunkLeaseRef held = 5;
}

// One granted chunk: items [first_item, first_item + item_count) of the
// job's item list.
message GrantedChunk {
  uint32 chunk_index = 1;
  uint64 item_id = 2;
  uint64 lease_seq = 3;
  uint32 first_item = 4;
  uint32 item_count = 5;
  // "sha256:<64 hex>" of the canonical JSON array of this chunk's items (the
  // agent checks the slice it cut from the item list against it).
  string items_digest = 6;
  bool speculative = 7;
}

message ChunkGrant {
  string job_id = 1;
  string attempt_id = 2;
  uint64 fencing_token = 3;
  repeated GrantedChunk chunks = 4;
  // Seconds until these leases expire unless renewed.
  double lease_timeout_s = 5;
}

// Controller -> agent: nothing to grant now.
message NoWork {
  string job_id = 1;
  string attempt_id = 2;
  uint64 fencing_token = 3;
  enum Reason {
    REASON_UNSPECIFIED = 0;
    // Every chunk is done or held by others for good: the lane ends (DONE).
    REASON_DRAINED = 1;
    // Chunks are still leased elsewhere and may come back: ask again after
    // retry_after_s.
    REASON_WAIT = 2;
    // The lane must stop pulling (the job failed or was cancelled; the
    // CancelAttempt follows).
    REASON_STOP = 3;
  }
  Reason reason = 4;
  double retry_after_s = 5;
}

// Durations of one chunk on the agent's monotonic clock (seconds).
message ChunkPhases {
  optional double stage_s = 1;
  optional double env_s = 2;
  optional double run_s = 3;
  optional double upload_s = 4;
}

// Agent -> controller (a report: buffered, replayed, acked once stored).
message ChunkResult {
  string job_id = 1;
  string attempt_id = 2;
  uint64 fencing_token = 3;
  uint32 chunk_index = 4;
  uint64 item_id = 5;
  uint64 lease_seq = 6;
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    // The chunk ran and its packed output was uploaded under the lane's grant.
    OUTCOME_DONE = 1;
    // The chunk failed (failure says how; retryable = may succeed elsewhere).
    OUTCOME_FAILED = 2;
    // The lane gives the lease back without running it to the end (it is
    // stopping, the chunk was cancelled): not the chunk's fault.
    OUTCOME_RELEASED = 3;
  }
  Outcome outcome = 7;
  // OUTCOME_DONE: "sha256:<64 hex>" of the chunk's packed {out} folder.
  string result_digest = 8;
  uint64 result_bytes = 9;
  optional int32 exit_code = 10;
  Failure failure = 11;
  ChunkPhases phases = 12;
  optional int32 signal = 13;
  // V0.10 G8 (D271): bytes the agent placed as this chunk's inputs (its item
  // files + the items file); unset = not measured.
  optional uint64 input_bytes = 14;
  // V0.10 G8 (D261): the last bytes of the chunk process's stderr, already
  // redacted of the job's secret values on the agent, at most 64 KiB
  // ([agent.split] chunk_stderr_tail_bytes); empty = none.
  bytes stderr_tail = 15;
}

// Agent -> controller every lease_timeout_s / 3: extend these leases.
message LeaseRenew {
  string job_id = 1;
  string attempt_id = 2;
  uint64 fencing_token = 3;
  repeated ChunkLeaseRef leases = 4;
}

// Controller -> agent: stop this chunk (its copy lost, or the job ended); its
// result will not be used.
message CancelChunk {
  string job_id = 1;
  string attempt_id = 2;
  uint64 fencing_token = 3;
  uint64 item_id = 4;
  uint64 lease_seq = 5;
  string reason = 6;
}

// ---------------------------------------------------------------------------
// RTT measurement (roadmap 0.3.10)
// ---------------------------------------------------------------------------
//
// RTT is measured by the controller on its own monotonic clock: loop.time() at
// Pong minus loop.time() at Ping. It is never derived from Heartbeat.agent_time
// (that difference is clock skew, not latency). The controller sends one Ping
// per lease interval per ONLINE session and keeps only the latest outstanding
// ping_id; an unanswered Ping simply expires when the next one is sent.

// Controller -> agent. The agent replies immediately with Pong{ping_id}.
message Ping {
  string ping_id = 1;
}

// Agent -> controller. Echoes Ping.ping_id.
//
// Clock offset (V0.9 G1, D213): a Ping/Pong is also one NTP-style exchange.
// The controller notes its wall clock at the Ping, the Pong's envelope
// `sent_at` is the agent's wall clock when it answered, and the controller's
// receive time is the Ping's wall time plus the monotonic RTT - so the
// controller estimates (agent clock - controller clock) +- RTT/2 from a recent
// window of exchanges. Older agents send no resolution (0 = unknown; the
// controller then assumes a coarse tick and widens the bound).
message Pong {
  string ping_id = 1;
  // Resolution of the agent's wall clock (the one that stamps `sent_at`), in
  // microseconds, from time.get_clock_info("time"); 0 = not reported.
  // Windows on Python 3.12 ticks in ~15.6 ms steps, so the bound must cover it.
  uint32 clock_resolution_us = 2;
}
