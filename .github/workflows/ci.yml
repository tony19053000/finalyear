# CI for MeshForge (roadmap 0.1.10).
#
# Jobs:  lint · types · unit (Linux + Windows) · component (Linux, 8 shards) ·
#        cluster (Linux) · fresh-clone (Linux + Windows) · eval-repro · api-docs · package-linux ·
#        package-windows · upgrade-from-release-linux · upgrade-windows · ci-ok
# Branch protection on `main` should require ONLY the `ci-ok` check: it passes
# iff every other job passed, so adding/renaming jobs never needs a settings change.
#
# Every command here is the same command a developer runs locally (see README
# "CI" section and .pre-commit-config.yaml); tool versions come from uv.lock.
#
# Supply chain: third-party actions are pinned to full commit SHAs (tag noted in
# the trailing comment); Dependabot (.github/dependabot.yml) bumps them.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

# A newer push to the same PR cancels the superseded run; runs on `main`
# (push / dispatch) always finish so every main commit gets a full result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.10.12"
  UV_PYTHON: "3.12"
  # Never let uv silently pick a system interpreter other than the pinned one.
  UV_PYTHON_PREFERENCE: only-managed
  PYTHONUTF8: "1"
  # Coloured pytest output only. Not FORCE_COLOR: rich (the `compute` CLI's
  # renderer) honours it, so CLI tests would see ANSI codes and an 80-column
  # "terminal" instead of plain piped output.
  PY_COLORS: "1"

jobs:
  lint:
    name: lint (ruff, import boundaries, protos, hygiene)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.UV_PYTHON }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      # --locked: fail if uv.lock is out of date with pyproject.toml.
      - run: uv sync --locked
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format --check
        if: ${{ !cancelled() }}
        run: uv run ruff format --check .
      - name: import boundaries (lint-imports)
        if: ${{ !cancelled() }}
        run: uv run lint-imports
      # V1.0 G3 (D413): every medium/high bandit finding in src/ is triaged in
      # scripts/bandit_triage.toml (reason + decision ref) or this step fails.
      - name: bandit gate (no untriaged medium/high)
        if: ${{ !cancelled() }}
        run: uv run python scripts/bandit_gate.py
      # Regenerates from proto/ into a temp dir and byte-compares with the
      # committed src/meshforge/common/proto/ tree (never overwrites it): a
      # hand-edited generated file, or a .proto change without regeneration,
      # fails this step with a diff (exit 1).
      - name: generated protos up to date
        if: ${{ !cancelled() }}
        run: uv run python scripts/gen_protos.py --check
      - name: cache pre-commit hook environments
        if: ${{ !cancelled() }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # File hygiene hooks only; the tool hooks above run as their own steps.
      - name: pre-commit hygiene hooks
        if: ${{ !cancelled() }}
        env:
          SKIP: ruff-check,ruff-format,mypy,import-linter,gen-protos-check,api-docs-check
        run: uv run pre-commit run --all-files --show-diff-on-failure

  types:
    name: types (mypy strict)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.UV_PYTHON }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      # The extras make SQLAlchemy, Alembic, psutil, scikit-learn, ... importable
      # for type checking; `gpu` (torch, a multi-GB CUDA wheel on Linux) is
      # deliberately not installed (D399).
      - run: uv sync --locked --extra controller --extra agent --extra ml
      - run: uv run mypy
      # V0.17 G4: the Windows-only service/installer modules (pywin32) are
      # type-checked as Windows code too (types-pywin32). Only those files:
      # the rest of src is checked for Linux above and has POSIX-only branches.
      - name: mypy --platform win32 (Windows service + installer modules)
        run: >-
          uv run mypy --platform win32 --follow-imports=silent
          src/meshforge/agent/winservice.py src/meshforge/agent/winservice_host.py
          src/meshforge/agent/winservice_ops.py src/meshforge/agent/winservice_admin.py
          src/meshforge/agent/winservice_supervisor.py src/meshforge/agent/wininstall.py
          src/meshforge/agent/winsetup.py src/meshforge/agent/console/launcher_windows.py
          src/meshforge/agent/console/checks_windows.py src/meshforge/common/windows_service.py
      # V0.17 G5: the Windows installer's upgrade records, as Windows code too.
      - name: mypy --platform win32 (G5 upgrade records)
        run: >-
          uv run mypy --platform win32 --follow-imports=silent
          src/meshforge/agent/winupgrade.py src/meshforge/common/upgrade_state.py
      # Each lab workload is a standalone container entrypoint named main.py, so
      # they cannot share one mypy run (duplicate module `main`); one run each.
      - name: mypy lab workloads (one run per entrypoint)
        shell: bash
        run: |
          for f in lab/workloads/*/main.py; do
            echo "mypy $f"
            uv run mypy "$f"
          done

  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # ~25 000 unit tests: ~22 min on an ubuntu runner (measured 2026-10-24),
    # Windows is slower; the budget leaves room without hiding a hang (each
    # test also has pytest-timeout's 300 s).
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.UV_PYTHON }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      # D399: the main jobs install every extra except `gpu` (torch is a
      # multi-GB CUDA wheel on Linux; the few torch-only test modules skip with
      # the reason). The no-extras install is covered by the fresh-clone job.
      - run: uv sync --locked --extra controller --extra agent --extra ml
      # `-o junit_family=xunit1` (all pytest steps): record_property, used by
      # the bench component tests, is incompatible with the xunit2 default.
      # Explicit (not via pytest markers) so proto generation determinism is
      # checked on Windows too (V0.1 criterion 4: identical output across OSes).
      - name: generated protos up to date
        run: uv run python scripts/gen_protos.py --check
      - name: pytest -m unit
        if: ${{ !cancelled() }}
        # Through the exit guard: a green summary with a non-zero exit (e.g. a
        # segfault at interpreter shutdown) is named as such in the log.
        run: uv run python scripts/pytest_exit_guard.py -m unit -o junit_family=xunit1 --junitxml=reports/junit-unit-${{ matrix.os }}.xml
      - name: upload junit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-unit-${{ matrix.os }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

  # ~3 300 component tests take ~3 h serially on a runner (2026-10-24), so
  # the tier is split into shards by test file (`--shard K/N`, tests/conftest.py;
  # files are dealt round-robin, so module/session fixtures stay in one shard).
  component:
    name: component (shard ${{ matrix.shard }}/8, Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The agent's env builder looks for a *system* Python 3.12 (`uv python
      # find --system`, with UV_* stripped from its environment), so the
      # setup-uv managed interpreter is invisible to it; ubuntu-latest's own
      # python3 is not 3.12.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.UV_PYTHON }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.UV_PYTHON }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      # No `gpu` extra: component tests never need torch.
      - run: uv sync --locked --extra controller --extra agent --extra ml
      - name: docker info
        run: docker info --format '{{.ServerVersion}} {{.OperatingSystem}}'
      # Postgres comes from testcontainers; Ryuk (enabled by default) reaps
      # containers even if the test process dies.
      - name: pytest -m component (one shard)
        run: uv run python scripts/pytest_exit_guard.py -m component --shard ${{ matrix.shard }}/8 -o junit_family=xunit1 --junitxml=reports/junit-component-${{ matrix.shard }}.xml
      - name: upload junit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-component-${{ matrix.shard }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

  # Roadmap 0.3.14 (V0.3 G6-B): a real controller + N real agents as local
  # processes with fault injection (tests/cluster; in-process FaultLink proxy,
  # D23). Linux only for now: Windows runners have no Linux Docker for the
  # Postgres fixture, and the harness's Windows paths (CREATE_NEW_PROCESS_GROUP,
  # CTRL_BREAK, no Job Object backstop) have not been run yet. The `slow` set
  # (shipped-timing criteria 2/3) is not run here: its bounds are the criteria
  # themselves and shared runners are noisy; run it with --run-slow.
  cluster:
    name: cluster (ubuntu-latest, Docker, processes)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The agent's env builder looks for a *system* Python 3.12 (`uv python
      # find --system`, with UV_* stripped from its environment), so the
      # setup-uv managed interpreter is invisible to it; ubuntu-latest's own
      # python3 is not 3.12.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.UV_PYTHON }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.UV_PYTHON }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      # The controller and agent run as subprocesses: both extras are needed.
      - run: uv sync --locked --extra controller --extra agent --extra ml
      - name: docker info
        run: docker info --format '{{.ServerVersion}} {{.OperatingSystem}}'
      # D399: the disk-full scenarios run an agent in its own user + mount
      # namespace on a tiny tmpfs. The runner's AppArmor restricts unprivileged
      # user namespaces (unshare works, then /proc/self/setgroups is EPERM);
      # lift that on this throw-away VM so the scenarios run instead of skip.
      - name: allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: pytest -m cluster
        run: uv run python scripts/pytest_exit_guard.py -m cluster -o junit_family=xunit1 --junitxml=reports/junit-cluster.xml
      - name: upload junit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-cluster
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

  # V1.0 G5 (D414): the API reference in docs/api/ (REST from the OpenAPI
  # documents, gRPC from proto/ via protoc, CLI from --help, SDK from
  # docstrings) is generated; a route, .proto or command change without
  # `scripts/gen_api_docs.py` fails here with the pages that drifted.
  api-docs:
    name: api-docs (generated API reference up to date)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.UV_PYTHON }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra controller --extra agent
      - name: docs/api matches the code
        run: uv run --no-sync python scripts/gen_api_docs.py --check

  # V1.0 G2 (D419): the evaluation analysis is reproducible - analyze.py +
  # make_report.py on the committed sample (scripts/eval/sample) give the
  # committed SHA-256 of every output, figures included (matplotlib from the
  # `evaluation` group, locked). An intended change: check_sample.py --update.
  eval-repro:
    name: eval-repro (evaluation analysis hashes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.UV_PYTHON }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra controller --extra ml --group evaluation
      - name: sample analysis + report + figures match the committed hashes
        run: uv run --no-sync python scripts/eval/check_sample.py

  # V0.1 success criterion 1 + D399: a fresh checkout with a *plain*
  # `uv sync` (default dependency group, no extras) must still start every CLI
  # and pass the unit tests that need no extra. Test modules whose import needs
  # an extra are skipped at collection with the reason (tests/conftest.py,
  # `_ExtrasAwareModule`); any other collection error still fails the job.
  fresh-clone:
    name: fresh-clone (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.UV_PYTHON }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - name: CLIs start without extras (--help)
        run: |
          uv run --no-sync compute --help
          uv run --no-sync meshforge-controller --help
          uv run --no-sync meshforge-agent --help
      - name: pytest -m unit (no extras)
        if: ${{ !cancelled() }}
        run: uv run --no-sync python scripts/pytest_exit_guard.py -m unit -o junit_family=xunit1 --junitxml=reports/junit-fresh-clone-${{ matrix.os }}.xml
      - name: upload junit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-fresh-clone-${{ matrix.os }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

  # V0.17 G1 (D384, D394, Q16): the agent bundle + .deb, built from this commit
  # and installed for real: lintian, ldd, reproducibility, then the package
  # tests in clean Ubuntu 22.04/24.04 systemd containers (install, migration,
  # restart/kill/exit codes, upgrade, remove, purge + lab/verify_uninstall.py)
  # and the packaged agent joining a real fabric and running a venv job. The
  # .deb files are uploaded with every run.
  package-linux:
    name: package-linux (bundle + .deb, Ubuntu systemd containers)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.UV_PYTHON }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      # agent: the lock-pinned uv wheel the bundle ships; controller: the
      # cluster harness of the join test.
      - run: uv sync --locked --extra controller --extra agent
      - name: cache pinned downloads (python-build-standalone, nfpm, wheels)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/meshforge-bundle
          key: meshforge-bundle-${{ hashFiles('packaging/pins.toml', 'uv.lock') }}
      - name: build the agent bundle
        run: uv run python scripts/build_bundle.py --role agent --out dist/
      - name: build the .deb (revision 1, and 2 for the upgrade test)
        run: |
          bundle=$(ls -d dist/meshforge-*-linux-x86_64)
          uv run python scripts/build_deb.py --bundle "$bundle" --out dist/
          uv run python scripts/build_deb.py --bundle "$bundle" --out dist/ --revision 2
      - name: the .deb is reproducible
        run: |
          bundle=$(ls -d dist/meshforge-*-linux-x86_64)
          uv run python scripts/build_deb.py --bundle "$bundle" --out dist/again/
          cmp dist/meshforge-agent_*-1_amd64.deb dist/again/meshforge-agent_*-1_amd64.deb
      - name: lintian (errors fail)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lintian
          lintian --version
          lintian --fail-on error --tag-display-limit 0 dist/meshforge-agent_*-1_amd64.deb
      # V0.17 G2: the controller package (bundle with the dashboard and the
      # managed PostgreSQL), size-checked against the Q17 budget. V1.0 G7
      # (D423): with the ml extra (the installed controller trains).
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: build the dashboard
        run: npm --prefix frontend ci && npm --prefix frontend run build
      - name: build the controller bundle and .deb (revisions 1 and 2)
        run: |
          uv run python scripts/build_bundle.py --role controller --out dist/controller/ --skip-dashboard-build
          bundle=$(ls -d dist/controller/meshforge-*-linux-x86_64)
          # D423: the controller bundle carries the ml extra (build_bundle ROLE_EXTRAS) and
          # its interpreter imports the whole training stack (the installed .deb trains
          # for real in tests/component/packaging/test_v10_g7_controller_ml.py)
          "$bundle/python/bin/python3.12" -I -c 'import json, sys; e = json.load(open(sys.argv[1]))["extras"]; sys.exit(0 if "ml" in e else f"BUILDINFO extras lack ml: {e}")' "$bundle/BUILDINFO.json"
          "$bundle/python/bin/python3.12" -I -c 'import sys, sklearn, scipy, lightgbm, xgboost; from meshforge.controller.ml.train import missing_libraries as m; sys.exit(f"missing: {m()}" if m() else 0)'
          uv run python scripts/build_deb.py --role controller --bundle "$bundle" --out dist/controller/
          uv run python scripts/build_deb.py --role controller --bundle "$bundle" --out dist/controller/ --revision 2
      - name: lintian, controller (errors fail)
        run: lintian --fail-on error --tag-display-limit 0 dist/controller/meshforge-controller_*-1_amd64.deb
      # V1.0 G3 (D413): the builders already refuse a hit; this re-scans the
      # artefacts exactly as they will be uploaded (keys, tokens, join codes,
      # secret files, MeshForge tests, dev passwords - never prints a value).
      - name: package secret scan (built artefacts)
        run: >-
          uv run python scripts/package_secret_scan.py
          dist/*.deb dist/*.tar.xz dist/controller/*.deb dist/controller/*.tar.xz
      - name: package tests (systemd containers, real fabric)
        env:
          MESHFORGE_TEST_DEB_DIR: dist
          MESHFORGE_TEST_CONTROLLER_DEB_DIR: dist/controller
        run: >-
          uv run python scripts/pytest_exit_guard.py --run-slow
          tests/component/packaging tests/cluster/test_v017_g1_deb_service.py
          --junitxml=reports/junit-package-linux.xml
      - name: upload packages
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-linux
          path: |
            dist/*.deb
            dist/*.deb.sha256
            dist/*.tar.xz
            dist/controller/*.deb
            dist/controller/*.deb.sha256
            dist/controller/*.tar.xz
            dist/meshforge-*-linux-x86_64/BUILDINFO.json
            reports/
          if-no-files-found: error
          retention-days: 14

  # V0.17 G4 (D385-D389, D395, Q28-Q33): the Windows agent bundle + Inno Setup
  # installer, built from this commit and installed for real on the runner
  # (elevated): a developer identity + the dev scheduled task first, then a
  # silent install (service RUNNING as NT SERVICE\MeshForgeAgent, same node_id,
  # console on loopback only, token/identity ACLs exact), crash / exit 4 / stop,
  # upgrade to revision 2 (same node_id), the installed service joining a real
  # fabric and running a venv job (honest CPU cap), uninstall (data kept) ->
  # lab/verify_uninstall.py, reinstall (same node) and uninstall with
  # /REMOVEDATA -> verify again. lab/windows/package_check.py does the checks.
  package-windows:
    name: package-windows (bundle + installer, real service)
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      SETUP_ARGS: /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.UV_PYTHON }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      # agent: the bundle's wheels and the dev identity; controller: the fabric
      # harness of the service's join test.
      - run: uv sync --locked --extra controller --extra agent
      - name: cache pinned downloads (python-build-standalone, Inno Setup, wheels)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~\AppData\Local\meshforge-bundle
          key: meshforge-bundle-windows-${{ hashFiles('packaging/pins.toml', 'uv.lock') }}
      - name: build the agent bundle
        run: uv run python scripts/build_bundle.py --role agent --os windows --out dist/ --cache "$env:LOCALAPPDATA\meshforge-bundle"
      - name: the bundle is reproducible (second build, manifests compared)
        run: |
          $bundle = (Get-ChildItem dist -Directory -Filter 'meshforge-*-windows-x86_64').FullName
          uv run python scripts/build_bundle.py --role agent --os windows --out dist/again/ --no-archive --cache "$env:LOCALAPPDATA\meshforge-bundle"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $again = (Get-ChildItem dist\again -Directory -Filter 'meshforge-*-windows-x86_64').FullName
          uv run python scripts/build_bundle.py --diff "$bundle\MANIFEST.sha256" "$again\MANIFEST.sha256"
      - name: build the installer (revision 1, and 2 for the upgrade test)
        run: |
          $bundle = (Get-ChildItem dist -Directory -Filter 'meshforge-*-windows-x86_64').FullName
          $version = (Get-Content "$bundle\BUILDINFO.json" | ConvertFrom-Json).version
          "BUNDLE=$bundle" >> $env:GITHUB_ENV
          "MF_VERSION=$version" >> $env:GITHUB_ENV
          uv run python scripts/build_windows_installer.py --bundle $bundle --out dist/ --cache "$env:LOCALAPPDATA\meshforge-bundle"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv run python scripts/build_windows_installer.py --bundle $bundle --out dist/ --revision 2 --cache "$env:LOCALAPPDATA\meshforge-bundle"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem dist\*.exe | Format-Table Name, Length
      # V1.0 G3 (D413): the bundle the installer packs + the .exe (raw bytes)
      - name: package secret scan (bundle + installer)
        run: |
          uv run python scripts/package_secret_scan.py $env:BUNDLE (Get-ChildItem dist\*.exe).FullName
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: a developer laptop (user-mode identity + dev scheduled task)
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null
          uv run meshforge-agent identity show
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv run python lab/windows/package_check.py seed --state reports/windows-state.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: silent install (revision 1)
        run: |
          $exe = "dist\MeshForge-Agent-Setup-$env:MF_VERSION-1.exe"
          $p = Start-Process $exe -ArgumentList "$env:SETUP_ARGS /LOG=`"$pwd\reports\install-1.log`"" -Wait -PassThru
          "installer exit code: $($p.ExitCode)"
          Get-Content "$env:ProgramData\MeshForge\logs\setup-result.json" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: installed service checks
        run: uv run python lab/windows/package_check.py installed --state reports/windows-state.json --version-dir "$env:MF_VERSION-1"
      - name: crash -> restarted by the SCM
        run: uv run python lab/windows/package_check.py crash
      - name: exit 4 -> stopped, not restarted
        run: uv run python lab/windows/package_check.py exit4
      - name: requested stop -> no process left
        run: uv run python lab/windows/package_check.py stop
      - name: upgrade (revision 2)
        run: |
          $exe = "dist\MeshForge-Agent-Setup-$env:MF_VERSION-2.exe"
          $p = Start-Process $exe -ArgumentList "$env:SETUP_ARGS /LOG=`"$pwd\reports\install-2.log`"" -Wait -PassThru
          "installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
          uv run python lab/windows/package_check.py upgraded --state reports/windows-state.json --version-dir "$env:MF_VERSION-2"
      - name: the installed service joins a fabric and runs a venv job
        env:
          MESHFORGE_TEST_WINDOWS_SERVICE: "1"
          MESHFORGE_TEST_PG: external
          MESHFORGE_TEST_PG_PASSWORD: root
        run: |
          # The runner's PostgreSQL (user postgres / password root, disabled by
          # default): the service of the version PGBIN names, else the only one.
          $name = $null
          if ($env:PGBIN) {
            $major = Split-Path (Split-Path $env:PGBIN -Parent) -Leaf
            if (Get-Service "postgresql-x64-$major" -ErrorAction SilentlyContinue) { $name = "postgresql-x64-$major" }
          }
          if (-not $name) { $name = (Get-Service -Name 'postgresql*' | Select-Object -First 1).Name }
          "PostgreSQL service: $name (PGBIN=$env:PGBIN)"
          Set-Service $name -StartupType Manual
          Start-Service $name
          uv run python scripts/pytest_exit_guard.py --run-slow -o junit_family=xunit1 tests/cluster/test_v017_g4_windows_service_fabric.py --junitxml=reports/junit-package-windows.xml
      - name: uninstall (data kept) + verify
        run: |
          $p = Start-Process "$env:ProgramFiles\MeshForge\unins000.exe" -ArgumentList "$env:SETUP_ARGS /LOG=`"$pwd\reports\uninstall-1.log`"" -Wait -PassThru
          "uninstaller exit code: $($p.ExitCode)"
          $deadline = (Get-Date).AddSeconds(120)
          while ((Test-Path "$env:ProgramFiles\MeshForge") -and ((Get-Date) -lt $deadline)) { Start-Sleep 1 }
          uv run python lab/verify_uninstall.py --os windows
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: reinstall keeps the node; uninstall with /REMOVEDATA + verify
        run: |
          $exe = "dist\MeshForge-Agent-Setup-$env:MF_VERSION-2.exe"
          $p = Start-Process $exe -ArgumentList "$env:SETUP_ARGS /LOG=`"$pwd\reports\install-3.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { "installer exit code: $($p.ExitCode)"; exit 1 }
          uv run python lab/windows/package_check.py reinstalled --state reports/windows-state.json --version-dir "$env:MF_VERSION-2"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Fix round 1 B1: a job could plant a junction in the state folders;
          # "remove all data" must delete the junction, never what it points to.
          $sentinel = Join-Path $env:RUNNER_TEMP 'mf-sentinel'
          New-Item -ItemType Directory -Force "$sentinel\inner" | Out-Null
          Set-Content "$sentinel\inner\precious.txt" 'keep me'
          $before = (Get-Acl -LiteralPath $sentinel).Sddl + '|' + (Get-Acl -LiteralPath "$sentinel\inner\precious.txt").Sddl
          New-Item -ItemType Directory -Force "$env:ProgramData\MeshForge\envs" | Out-Null
          cmd /c mklink /J "$env:ProgramData\MeshForge\envs\trap" "$sentinel"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $p = Start-Process "$env:ProgramFiles\MeshForge\unins000.exe" -ArgumentList "$env:SETUP_ARGS /REMOVEDATA /LOG=`"$pwd\reports\uninstall-2.log`"" -Wait -PassThru
          "uninstaller exit code: $($p.ExitCode)"
          $deadline = (Get-Date).AddSeconds(120)
          while ((Test-Path "$env:ProgramFiles\MeshForge") -and ((Get-Date) -lt $deadline)) { Start-Sleep 1 }
          uv run python lab/verify_uninstall.py --os windows --data-removed
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $after = (Get-Acl -LiteralPath $sentinel).Sddl + '|' + (Get-Acl -LiteralPath "$sentinel\inner\precious.txt").Sddl
          if ($after -ne $before) { "the junction target's owner/ACL changed:`n$before`n$after"; exit 1 }
          if ((Get-Content "$sentinel\inner\precious.txt") -ne 'keep me') { 'the junction target lost its contents'; exit 1 }
          'junction target untouched (owner, ACL, contents)'
      - name: collect logs
        if: ${{ !cancelled() }}
        run: |
          New-Item -ItemType Directory -Force reports\service | Out-Null
          Copy-Item "$env:ProgramData\MeshForge\logs\*" reports\service -ErrorAction SilentlyContinue
          Get-ChildItem "$env:TEMP\meshforge-uninstall.json" -ErrorAction SilentlyContinue | Copy-Item -Destination reports
      - name: upload installer + reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-windows
          path: |
            dist/*.exe
            dist/*.exe.sha256
            dist/meshforge-*-windows-x86_64/BUILDINFO.json
            reports/
          if-no-files-found: error
          retention-days: 14

  # V0.17 G5 (brief §5e item 1, Q36): upgrade from the PREVIOUS RELEASE (the
  # assets pinned in packaging/previous-release.toml) to the packages
  # package-linux built from this commit: agent .deb on 22.04 + 24.04 (same
  # node_id, config, owner settings), controller + agent on 24.04 with a real
  # job in the database (rows kept, migrations applied, a job runs after the
  # upgrade). Until v0.17.0 is published nothing is pinned: the tests SKIP
  # with that reason (printed with -rs) and a warning annotation says so -
  # never a silent pass. The rollback matrix itself runs in package-linux.
  upgrade-from-release-linux:
    name: upgrade-from-release (Linux .deb, previous release -> this build)
    needs: package-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.UV_PYTHON }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra controller --extra agent
      - name: the previous release is pinned?
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('packaging/previous-release.toml','rb'))['version'])")
          if [ -z "$version" ]; then
            echo "::warning title=upgrade-from-release::no previous release is pinned in packaging/previous-release.toml (no GitHub Release yet, Q36) - the upgrade-from-release tests are SKIPPED, not passed. Publish v0.17.0 (release.yml) and pin its assets."
          else
            echo "upgrading from the previous release $version"
          fi
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: package-linux
          path: .
      - name: upgrade tests (systemd containers)
        env:
          MESHFORGE_TEST_UPGRADE_FROM_RELEASE: "1"
          MESHFORGE_TEST_DEB_DIR: dist
          MESHFORGE_TEST_CONTROLLER_DEB_DIR: dist/controller
          MESHFORGE_TEST_REPORT_DIR: reports/verify-uninstall
        run: >-
          uv run python scripts/pytest_exit_guard.py --run-slow -rs
          tests/component/packaging/test_v017_g5_upgrade_from_release.py
          -o junit_family=xunit1 --junitxml=reports/junit-upgrade-from-release-linux.xml
      - name: upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upgrade-from-release-linux
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

  # V0.17 G5 (rollback matrix, Windows rows that need a real SCM; Q38): on a
  # fresh runner with the installers package-windows built: install revision
  # 1 -> forced-failure trigger -> revision 2 must roll back (outcome
  # rolled_back, binPath AND current.txt on revision 1, same node, RUNNING) ->
  # revision 2 again works -> uninstall -> verify (JSON kept). Then, when a
  # previous release is pinned, previous release -> this build -> uninstall
  # -> verify; otherwise a warning says the step was skipped. The cut-off
  # (power loss) rows are unit-tested against the fake SCM
  # (tests/unit/agent/test_v017_g5_winsetup_matrix.py).
  upgrade-windows:
    name: upgrade-windows (forced rollback, previous release -> this build)
    needs: package-windows
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      SETUP_ARGS: /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.UV_PYTHON }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra agent
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: package-windows
          path: .
      - name: install revision 1
        run: |
          New-Item -ItemType Directory -Force reports\verify-uninstall | Out-Null
          $info = Get-ChildItem dist -Recurse -Filter BUILDINFO.json | Select-Object -First 1
          $version = (Get-Content $info.FullName | ConvertFrom-Json).version
          "MF_VERSION=$version" >> $env:GITHUB_ENV
          uv run meshforge-agent identity show
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv run python lab/windows/package_check.py seed --state reports/windows-state.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $p = Start-Process "dist\MeshForge-Agent-Setup-$version-1.exe" -ArgumentList "$env:SETUP_ARGS /LOG=`"$pwd\reports\g5-install-1.log`"" -Wait -PassThru
          "installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
          uv run python lab/windows/package_check.py installed --state reports/windows-state.json --version-dir "$version-1"
      - name: forced failure -> revision 2 rolls back to revision 1
        run: |
          uv run python lab/windows/package_check.py trigger --version-dir "$env:MF_VERSION-2"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $p = Start-Process "dist\MeshForge-Agent-Setup-$env:MF_VERSION-2.exe" -ArgumentList "$env:SETUP_ARGS /LOG=`"$pwd\reports\g5-install-2-forced.log`"" -Wait -PassThru
          # 100 + the setup step's exit code: rolled_back exits 1 -> 101
          "installer exit code: $($p.ExitCode) (expected 101: rolled back)"
          if ($p.ExitCode -ne 101) { exit 1 }
          uv run python lab/windows/package_check.py rolled-back --state reports/windows-state.json --version-dir "$env:MF_VERSION-1"
      - name: revision 2 again (trigger consumed) -> upgraded
        run: |
          $p = Start-Process "dist\MeshForge-Agent-Setup-$env:MF_VERSION-2.exe" -ArgumentList "$env:SETUP_ARGS /LOG=`"$pwd\reports\g5-install-2.log`"" -Wait -PassThru
          "installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
          uv run python lab/windows/package_check.py upgraded --state reports/windows-state.json --version-dir "$env:MF_VERSION-2"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (Test-Path "$env:ProgramFiles\MeshForge\upgrade\rolled-back.json") { 'rolled-back.json still there after a good upgrade'; exit 1 }
      - name: uninstall after rollback + upgrade -> verify (JSON kept)
        run: |
          $p = Start-Process "$env:ProgramFiles\MeshForge\unins000.exe" -ArgumentList "$env:SETUP_ARGS /REMOVEDATA /LOG=`"$pwd\reports\g5-uninstall.log`"" -Wait -PassThru
          "uninstaller exit code: $($p.ExitCode)"
          $deadline = (Get-Date).AddSeconds(120)
          while ((Test-Path "$env:ProgramFiles\MeshForge") -and ((Get-Date) -lt $deadline)) { Start-Sleep 1 }
          uv run python lab/verify_uninstall.py --os windows --data-removed --json | Tee-Object reports\verify-uninstall\windows-rollback-upgrade.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: previous release -> this build (when pinned)
        run: |
          $pins = uv run python -c "import tomllib,json; print(json.dumps(tomllib.load(open('packaging/previous-release.toml','rb'))))" | ConvertFrom-Json
          if (-not $pins.version) {
            "::warning title=upgrade-from-release::no previous release is pinned in packaging/previous-release.toml (Q36) - the Windows previous-release upgrade is SKIPPED, not passed"
            exit 0
          }
          $old = "$env:RUNNER_TEMP\previous-setup.exe"
          Invoke-WebRequest -Uri $pins.windows_exe.url -OutFile $old
          $sha = (Get-FileHash -Algorithm SHA256 $old).Hash.ToLower()
          if ($sha -ne $pins.windows_exe.sha256) { "sha256 $sha is not the pinned $($pins.windows_exe.sha256)"; exit 1 }
          uv run meshforge-agent identity show
          uv run python lab/windows/package_check.py seed --state reports/windows-state-release.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $p = Start-Process $old -ArgumentList "$env:SETUP_ARGS /LOG=`"$pwd\reports\g5-release-old.log`"" -Wait -PassThru
          "previous release installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
          $p = Start-Process "dist\MeshForge-Agent-Setup-$env:MF_VERSION-1.exe" -ArgumentList "$env:SETUP_ARGS /LOG=`"$pwd\reports\g5-release-new.log`"" -Wait -PassThru
          "this build's installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
          uv run python lab/windows/package_check.py upgraded --state reports/windows-state-release.json --version-dir "$env:MF_VERSION-1"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $p = Start-Process "$env:ProgramFiles\MeshForge\unins000.exe" -ArgumentList "$env:SETUP_ARGS /REMOVEDATA" -Wait -PassThru
          $deadline = (Get-Date).AddSeconds(120)
          while ((Test-Path "$env:ProgramFiles\MeshForge") -and ((Get-Date) -lt $deadline)) { Start-Sleep 1 }
          uv run python lab/verify_uninstall.py --os windows --data-removed --json | Tee-Object reports\verify-uninstall\windows-release-upgrade.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: collect logs
        if: ${{ !cancelled() }}
        run: |
          New-Item -ItemType Directory -Force reports\service | Out-Null
          Copy-Item "$env:ProgramData\MeshForge\logs\*" reports\service -ErrorAction SilentlyContinue
      - name: upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upgrade-windows
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

  # Single required status check for branch protection.
  ci-ok:
    name: ci-ok
    if: ${{ always() }}
    needs: [lint, types, unit, component, cluster, fresh-clone, eval-repro, api-docs, package-linux, package-windows, upgrade-from-release-linux, upgrade-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: all required jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::a required CI job did not succeed ($r)"
              exit 1
            fi
          done
