# Triaged bandit findings (V1.0 G3, D413). `scripts/bandit_gate.py` runs
# `bandit -r src -ll` (medium + high severity) and fails on any finding that is
# not listed here. A finding is keyed by its test id, its file and the stripped
# text of the flagged source line, so it survives line shifts but a changed line
# must be re-triaged. Every entry needs a `reason` (a sentence) and a `ref`
# (where the decision is recorded). Low-severity findings are not gated (see
# docs/reports/release-v1.0-security.md "What was not done").
#
# To add one: run `uv run python scripts/bandit_gate.py`, copy the printed
# `[[finding]]` block of the untriaged finding here, and write why it is safe.

# --- B608: SQL built with string operations --------------------------------
# Verified (V1.0 G3): every interpolated value is a module-level constant of the
# same file - never a request, a node or a user value.

[[finding]]
test_id = "B608"
file = "src/meshforge/common/_gc_schema.py"
line = "_TRIGGERS: Final = \"\"\""
reason = "@HELD is replaced by _held() with the module constant _HELD_SQL and a fixed column name; no runtime value reaches the SQL text."
ref = "D91, D119; V1.0 G3 security report"

[[finding]]
test_id = "B608"
file = "src/meshforge/common/_gc_schema.py"
line = "\"INSERT INTO blob_lru SELECT key, last_use, @HELD FROM item WHERE kind = 'blob'\""
reason = "_MIRROR is a module constant; @HELD is the constant _HELD_SQL for the fixed column item.key."
ref = "D91, D119; V1.0 G3 security report"

[[finding]]
test_id = "B608"
file = "src/meshforge/common/_gc_schema.py"
line = "_REHOLD: Final = \"UPDATE blob_lru SET held = @HELD WHERE key = ?\".replace("
reason = "_REHOLD is a module constant; the blob key is a bound parameter (?), @HELD is the constant _HELD_SQL."
ref = "D91, D119; V1.0 G3 security report"

[[finding]]
test_id = "B608"
file = "src/meshforge/common/_gc_schema.py"
line = "\"UPDATE blob_lru SET held = @HELD \""
reason = "_REHOLD_MEMBERS is a module constant; the tree key is a bound parameter (?), @HELD is the constant _HELD_SQL."
ref = "D91, D119; V1.0 G3 security report"

[[finding]]
test_id = "B608"
file = "src/meshforge/common/_gc_schema.py"
line = "_BLOB_VICTIMS: Final = \"\"\""
reason = "_BLOB_VICTIMS is a module constant; cutoff and limit are named bound parameters, @HELD is the constant _HELD_SQL."
ref = "D91, D119; V1.0 G3 security report"

[[finding]]
test_id = "B608"
file = "src/meshforge/controller/store/migrations/versions/0018_rotation_users.py"
line = "sa.text(f\"DELETE FROM audit_event WHERE action IN ({new_actions})\")  # noqa: S608 - frozen literals"
reason = "new_actions is _listed() of the frozen module tuples ACTIONS_0016/ACTIONS_0018 (fixed audit action names); a migration takes no input."
ref = "migration 0018; V1.0 G3 security report"

[[finding]]
test_id = "B608"
file = "src/meshforge/controller/store/migrations/versions/0028_split_combine.py"
line = "f\"UPDATE {table} SET failure_type = 'internal_error' \"  # noqa: S608 - constant table names"
