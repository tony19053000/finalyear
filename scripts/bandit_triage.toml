# --- B108: hard-coded temp paths -------------------------------------------

[[finding]]
test_id = "B108"
file = "src/meshforge/agent/execution/docker_runtime.py"
line = "_CONTAINER_TMP: Final = \"/tmp\"  # noqa: S108 - a private tmpfs inside the container"
reason = "A path inside the job container, mounted as a private size-capped tmpfs; it never names a host directory."
ref = "D51 (container sandbox); V1.0 G3 security report"

[[finding]]
test_id = "B108"
file = "src/meshforge/agent/execution/sandbox_check.py"
line = "_TMP: Final = \"/tmp\"  # noqa: S108 - the container's own tmpfs, not a host path"
reason = "The sandbox checker verifies the container's own /tmp is a size-capped tmpfs; it is a mount point name, not a host file."
ref = "D51 (container sandbox); V1.0 G3 security report"

[[finding]]
test_id = "B108"
file = "src/meshforge/agent/execution/sandbox_check.py"
line = "raise SandboxViolationError(\"tmpfs\", \"/tmp is not a size-capped tmpfs\")  # noqa: S108"
reason = "An error message text naming the container mount; no file is opened."
ref = "D51 (container sandbox); V1.0 G3 security report"

[[finding]]
test_id = "B108"
file = "src/meshforge/agent/execution/secret_files.py"
line = "_SHM: Final = Path(\"/dev/shm\")  # noqa: S108 - a private 0700 subfolder, owner-checked"
reason = "Secrets are written to a private 0700 subfolder of /dev/shm whose owner and mode are checked before use (no shared predictable file)."
ref = "V0.7 secret files; THREAT_MODEL; V1.0 G3 security report"

# --- B604: "shell=True" ----------------------------------------------------

[[finding]]
test_id = "B604"
file = "src/meshforge/cli/completion.py"
line = "prog_name=prog_name, complete_var=complete_var, shell=shell"
reason = "False positive: `shell` is Typer's get_completion_script() keyword naming the shell (bash/zsh/pwsh); no subprocess is started."
ref = "V0.8 G3 shell completion; V1.0 G3 security report"

# --- B506: yaml.load -------------------------------------------------------

[[finding]]
test_id = "B506"
file = "src/meshforge/common/manifest.py"
line = "data = yaml.load(text, Loader=_StrictSafeLoader)  # noqa: S506 - SafeLoader subclass"
reason = "_StrictSafeLoader subclasses yaml.SafeLoader (no arbitrary object construction) and also refuses aliases and duplicate keys; a unit test pins the base class."
ref = "tests/unit/test_v10_g3_security_l1.py; V1.0 G3 security report"

