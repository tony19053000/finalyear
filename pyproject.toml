# MeshForge — Intelligent Distributed Compute Fabric (working title).
# One package, several entry points (ADR-0010). Managed with uv; uv.lock is tracked.

[project]
name = "meshforge"
version = "0.1.0.dev0"
description = "Intelligent distributed compute fabric for heterogeneous personal devices"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "MeshForge team" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Private :: Do Not Upload",
]
# Core: needed by `common`, `cli` and `sdk` (the SDK must stay installable without
# controller/agent extras).
dependencies = [
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "structlog>=26.1",
    "python-ulid>=4.0",
    # Uncapped since V0.4 G1 (D40, D43b): the clean-close decision is the agent's explicit
    # Goodbye, so nothing depends on how a grpcio version ends the request iterator.
    # test_stream_end_liveness.py::test_grpc_aio_ends_the_request_iterator_normally_on_a_client_cancel
    # only documents that behaviour; if a new grpcio changes it, update the test, not the code.
    "grpcio>=1.84",
    "protobuf>=7.36",
    "typer>=0.27",
    "rich>=15.0",
    # Node identity keypair (ADR-0013): ECDSA P-256 PKCS#8 PEM; the same key signs
    # the V0.7 CSR. Core (not the agent extra) because the identity module must
    # import on a base install and the CLI will read the identity file.
    "cryptography>=46",
    # HTTP client. Core (not an extra) because `compute` talks to the controller's
    # read-only REST surface and the SDK will use the same client - neither may
    # import `controller` (lint-imports: cli/sdk see only `common`). D15.
    "httpx>=0.28",
    # V0.4 (brief D46/D47/D53): the CLI packs projects and the agent unpacks them via
    # `common.bundle` (deterministic tar + zstd, .gitignore/.computeignore rules);
    # `common.manifest` reads compute.yaml (safe_load only); `compute logs -f` follows
    # a WebSocket. All four are needed on a base install (cli/common).
    "zstandard>=0.23",
    "pathspec>=0.12",
    "pyyaml>=6.0",
    "websockets>=15.0",
]

[project.optional-dependencies]
controller = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.53",
    "sqlalchemy[asyncio]>=2.0.53",
    "asyncpg>=0.31",
    # Alembic runs through the async engine (asyncpg) via the async env.py template,
    # so no sync driver (psycopg) is needed.
    "alembic>=1.20",
    "zeroconf>=0.151",
]
agent = [
    "psutil>=7.2",
    "nvidia-ml-py>=13.610",
    "zeroconf>=0.151",
    # Hardware scores (0.3.4, brief §5g D30): the CPU GFLOP/s and memory-bandwidth
    # kernels need a BLAS; numpy bundles OpenBLAS on every OS we use. Imported only
    # by the benchmark *child* process (agent/benchmarks/child.py), never by the
    # agent itself. torch, when present, is preferred by the child.
    "numpy>=2.3",
    # V0.4 Docker runtime (ADR-0004, brief D51): blocking SDK calls run via
    # asyncio.to_thread; nodes without Docker fall back to the subprocess runtime.
    "docker>=7.1",
]
# CPU/CUDA variant selection (PyTorch wheel index per platform) is decided in V0.2;
# here torch comes from the default index. Only installed with `--extra gpu`.
gpu = [
    "torch>=2.14",
]

# All three run `--version` on a base install; controller/agent need their extras
# only for real operation (heavy imports are kept lazy).
[project.scripts]
compute = "meshforge.cli.app:main"
meshforge-controller = "meshforge.controller.app:main"
meshforge-agent = "meshforge.agent.main:main"

[dependency-groups]
# Roadmap 0.1.2 says "extra dev"; a PEP 735 dependency group is used instead so dev
# tools are not published as a user-facing extra and `uv sync` installs them by default.
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "testcontainers[postgres]>=4.15",
    "ruff>=0.16",
    "mypy>=2.3",
    "pre-commit>=4.6",
    "grpcio-tools>=1.84",
    "mypy-protobuf>=5.1",
    "types-protobuf>=7.35",
    "types-grpcio>=1.83",
    "types-PyYAML>=6.0",
    "types-docker>=7.1",
    "import-linter>=2.15",
    "pytest-timeout>=2.4",
]

# ---------------------------------------------------------------------------
# pytest (roadmap 0.1.8, "Test tiers" in DEVELOPMENT_ROADMAP quality gates).
# Tier = first directory under tests/ (tests/unit -> `unit`, ...). tests/conftest.py
# auto-applies the tier marker from the directory and fails collection if a test
# lives outside a tier directory or carries a different/second tier marker.
# Hardware/long tiers (lab, gpu, soak, chaos) are skipped unless opted in with
# --run-lab / --run-gpu / --run-soak / --run-chaos, so a bare `pytest` never fails
# for missing hardware. Tests needing Docker (the `docker` marker or the shared
# Postgres fixtures) skip with a reason when no Docker daemon is reachable.
# Import mode stays `prepend` (pytest's default, set explicitly): tests/ has no
# __init__.py and tests/unit/_import_guard.py is imported as a top-level module.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--import-mode=prepend",
    "-ra",
]
xfail_strict = true
# Tier markers (one per test, = its first directory under tests/, auto-applied):
# unit, component, cluster, lab, e2e, soak, chaos. Capability markers (combine with
# any tier): docker, gpu, slow. Policy lives in tests/conftest.py.
markers = [
    "unit: tier - pure logic, no I/O beyond tmp files; must pass on Linux and Windows",
    "component: tier - real gRPC/DB/Docker/subprocess, one process each",
    "cluster: tier - controller + N agents as local processes, FaultLink proxy faults (D23)",
    "lab: tier - real laptops on the LAN (human-run); skipped unless --run-lab",
    "e2e: tier - dashboard UI end-to-end (Playwright)",
    "soak: tier - long-running stability runs; skipped unless --run-soak",
    "chaos: tier - long-running randomised fault injection; skipped unless --run-chaos",
    "docker: capability - needs a reachable Docker daemon; skipped with a reason otherwise",
    "gpu: capability - needs an NVIDIA GPU with CUDA; skipped unless --run-gpu (and CUDA present)",
    "slow: capability - takes minutes (network, cold caches, e.g. fresh-clone uv sync); skipped unless --run-slow",
]
# Every warning is an error (unknown marks, deprecations, unclosed resources);
# add targeted `ignore:` entries here with a reason when a dependency forces one.
filterwarnings = [
    "error",
]
# strict: only tests/fixtures marked for asyncio run on pytest-asyncio's loop, so
# the anyio pytest plugin (pulled in via httpx/fastapi) never fights over them.
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
# pytest-timeout: a hung cluster/failure-injection test must fail, not stall CI.
# Covers setup too, so the first-ever Postgres image pull must fit (hence 300 s);
# individual tests may tighten it with @pytest.mark.timeout(...).
timeout = 300

[build-system]
# hatchling: mature, zero-config src layout, and supports build hooks / force-include
# should generated artefacts (protos, dashboard bundle) need packaging later.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meshforge"]

# ---------------------------------------------------------------------------
# Import boundaries (roadmap 0.1.4, ARCHITECTURE §21). Run: `uv run lint-imports`.
# Forbidden contracts also catch *indirect* imports (e.g. cli -> sdk -> controller).
# Decision: `agent` must NOT import `gpu_service`. The agent supervises the GPU
# service as a separate process (ARCHITECTURE §3) in its own PyTorch/CUDA
# environment and talks to it only over the GpuService gRPC API, so the agent
# never needs (or gets) torch on its import path. Shared message types live in
# `common` (generated protos).
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "meshforge"

[[tool.importlinter.contracts]]
id = "controller-agent-independent"
name = "controller and agent never import each other"
type = "independence"
modules = ["meshforge.controller", "meshforge.agent"]

[[tool.importlinter.contracts]]
id = "common-is-bottom-layer"
name = "common imports no other meshforge subpackage"
type = "forbidden"
source_modules = ["meshforge.common"]
forbidden_modules = [
    "meshforge.controller",
    "meshforge.agent",
    "meshforge.gpu_service",
    "meshforge.sdk",
    "meshforge.cli",
]

[[tool.importlinter.contracts]]
id = "controller-imports-common-only"
name = "controller imports only common"
type = "forbidden"
source_modules = ["meshforge.controller"]
forbidden_modules = [
    "meshforge.agent",
    "meshforge.gpu_service",
    "meshforge.sdk",
    "meshforge.cli",
]

[[tool.importlinter.contracts]]
id = "agent-imports-common-only"
name = "agent imports only common (gpu_service is a supervised process, not a library)"
type = "forbidden"
source_modules = ["meshforge.agent"]
forbidden_modules = [
    "meshforge.controller",
    "meshforge.gpu_service",
    "meshforge.sdk",
    "meshforge.cli",
]

[[tool.importlinter.contracts]]
id = "gpu-service-imports-common-only"
name = "gpu_service imports only common"
type = "forbidden"
source_modules = ["meshforge.gpu_service"]
forbidden_modules = [
    "meshforge.controller",
    "meshforge.agent",
    "meshforge.sdk",
    "meshforge.cli",
]

[[tool.importlinter.contracts]]
id = "sdk-imports-common-only"
name = "sdk imports only common"
type = "forbidden"
source_modules = ["meshforge.sdk"]
forbidden_modules = [
    "meshforge.controller",
    "meshforge.agent",
    "meshforge.gpu_service",
    "meshforge.cli",
]

[[tool.importlinter.contracts]]
id = "cli-imports-common-and-sdk-only"
name = "cli imports only common and sdk"
type = "forbidden"
source_modules = ["meshforge.cli"]
forbidden_modules = [
    "meshforge.controller",
    "meshforge.agent",
    "meshforge.gpu_service",
]

# ---------------------------------------------------------------------------
# ruff: lint + format (roadmap 0.1.9). Run: `uv run ruff check .` and
# `uv run ruff format --check .`. Generated protobuf code is excluded (it also
# carries `# ruff: noqa` / `# fmt: off` headers as a second line of defence).
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
# The formatter wraps code at 88; E501 (below) only flags lines over 100, which
# the formatter cannot fix (long comments, docstrings, string literals).
line-length = 88
src = ["src", "tests", "scripts", "lab"]
extend-exclude = ["src/meshforge/common/proto"]
# Apply excludes even to paths passed explicitly (pre-commit passes filenames).
force-exclude = true

[tool.ruff.format]
# Markdown code blocks in docs/ are illustrative snippets, not project code.
exclude = ["docs/**"]
docstring-code-format = true
line-ending = "lf"

[tool.ruff.lint]
# Chosen for bug-finding value, not style noise:
#   E/W/F pycodestyle+pyflakes · I isort · UP pyupgrade · B bugbear
#   SIM simplify · C4 comprehensions · PIE misc · RUF ruff-specific
#   S bandit security (this system is remote code execution by design)
#   BLE blind `except Exception` (failures must be typed, ARCHITECTURE §17)
#   A builtin shadowing · N pep8 naming · DTZ naive datetimes (timestamps are UTC)
#   ASYNC asyncio pitfalls (controller/agent are asyncio) · LOG/G logging misuse
#   T10/T20 leftover debugger/print · PT pytest style · PERF perf anti-patterns
#   TRY exception-handling anti-patterns · PGH blanket noqa/type: ignore · PLE errors
select = [
    "E", "W", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RUF", "S", "BLE", "A",
    "N", "DTZ", "ASYNC", "LOG", "G", "T10", "T20", "PT", "PERF", "TRY", "PGH",
    "PLE",
]
ignore = [
    "TRY003", # long messages in raise are fine; custom exception per message is overkill
    "PT011",  # pytest.raises(ValueError) without match=: the type is often the contract
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",                          # assert is how pytest works
    "S105", "S106",                  # fake secrets are test data (redaction tests)
    "S108",                          # literal /tmp paths are test data, never opened
    "S301",                          # pickle round-trip of our own objects
    "S603", "S607",                  # tests run our own CLIs/tools as subprocesses
    "N806",                          # CamelCase locals for dynamically built classes
    "PT018",                         # composite asserts are readable in tests
    "TRY",                           # tests raise inside try on purpose
]
"scripts/**" = [
    "S603", # dev scripts run fixed tool commands (protoc via grpc_tools)
    "T201", # dev scripts report via print
]
"lab/**" = [
    "S603", # lab probes run fixed tool commands (argv lists, no shell, resolved via PATH)
]
"src/meshforge/controller/store/migrations/**" = [
    "N999", # Alembic revision files are named 0001_*.py
]

[tool.ruff.lint.pycodestyle]
max-line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["meshforge"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

# ---------------------------------------------------------------------------
# mypy (roadmap 0.1.9). `uv run mypy` with no arguments checks src, tests and
# scripts. Strict everywhere (roadmap requires common/controller/agent; the rest
# is already clean, so strict costs nothing and keeps it that way). Only the
# generated protobuf modules are exempt (mypy-protobuf .pyi stubs still type them).
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "scripts", "lab"]
# tests/ has no __init__.py (pytest prepend import mode); explicit bases give each
# conftest.py a distinct module name. tests/unit is a base because the unit tests
# import `_import_guard` as a top-level module; tests/_support likewise for the shared
# test helpers (`containers`), which tests/conftest.py puts on sys.path; lab/ so the
# lab helper package `_inventory` resolves like at runtime. Separator ","
# works on Windows too.
mypy_path = "$MYPY_CONFIG_FILE_DIR/src,$MYPY_CONFIG_FILE_DIR/tests/unit,$MYPY_CONFIG_FILE_DIR/tests/_support,$MYPY_CONFIG_FILE_DIR/lab"
explicit_package_bases = true
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
# redundant-expr is deliberately not enabled: it flags defensive runtime type checks
# at trust boundaries (e.g. isinstance on values that arrive from untyped callers).
enable_error_code = ["ignore-without-code", "truthy-bool"]
exclude = ['^src/meshforge/common/proto/']

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# The roadmap's hard requirement: these three packages must stay strict. Restated
# explicitly so relaxing the global default later cannot silently weaken them.
[[tool.mypy.overrides]]
module = ["meshforge.common.*", "meshforge.controller.*", "meshforge.agent.*"]
strict = true

# Generated protobuf/gRPC code: types come from the generated .pyi stubs.
[[tool.mypy.overrides]]
module = ["meshforge.common.proto.*"]
ignore_errors = true

# Third-party modules without type information. torch is only present with
# `--extra gpu`; docker comes in via testcontainers; asyncpg ships no stubs; yaml
# (PyYAML, via pre-commit) is only read by tests and has no stubs installed.
[[tool.mypy.overrides]]
module = [
    "docker", "docker.*", "torch", "torch.*", "asyncpg", "asyncpg.*", "yaml",
]
ignore_missing_imports = true
