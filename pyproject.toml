# MeshForge — Intelligent Distributed Compute Fabric (working title).
# One package, several entry points (ADR-0010). Managed with uv; uv.lock is tracked.

[project]
name = "meshforge"
version = "0.1.0.dev0"
description = "Intelligent distributed compute fabric for heterogeneous personal devices"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "MeshForge team" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Private :: Do Not Upload",
]
# Core: needed by `common`, `cli` and `sdk` (the SDK must stay installable without
# controller/agent extras).
dependencies = [
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "structlog>=26.1",
    "python-ulid>=4.0",
    "grpcio>=1.84",
    "protobuf>=7.36",
    "typer>=0.27",
    "rich>=15.0",
]

[project.optional-dependencies]
controller = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.53",
    "sqlalchemy[asyncio]>=2.0.53",
    "asyncpg>=0.31",
    # Alembic runs through the async engine (asyncpg) via the async env.py template,
    # so no sync driver (psycopg) is needed.
    "alembic>=1.20",
    "zeroconf>=0.151",
]
agent = [
    "psutil>=7.2",
    "nvidia-ml-py>=13.610",
    "zeroconf>=0.151",
    "httpx>=0.28",
]
# CPU/CUDA variant selection (PyTorch wheel index per platform) is decided in V0.2;
# here torch comes from the default index. Only installed with `--extra gpu`.
gpu = [
    "torch>=2.14",
]

# All three run `--version` on a base install; controller/agent need their extras
# only for real operation (heavy imports are kept lazy).
[project.scripts]
compute = "meshforge.cli.app:main"
meshforge-controller = "meshforge.controller.app:main"
meshforge-agent = "meshforge.agent.main:main"

[dependency-groups]
# Roadmap 0.1.2 says "extra dev"; a PEP 735 dependency group is used instead so dev
# tools are not published as a user-facing extra and `uv sync` installs them by default.
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "testcontainers[postgres]>=4.15",
    "ruff>=0.16",
    "mypy>=2.3",
    "pre-commit>=4.6",
    "grpcio-tools>=1.84",
    "mypy-protobuf>=5.1",
    "types-protobuf>=7.35",
    "import-linter>=2.15",
]

[build-system]
# hatchling: mature, zero-config src layout, and supports build hooks / force-include
# should generated artefacts (protos, dashboard bundle) need packaging later.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meshforge"]

# ---------------------------------------------------------------------------
# Import boundaries (roadmap 0.1.4, ARCHITECTURE §21). Run: `uv run lint-imports`.
# Forbidden contracts also catch *indirect* imports (e.g. cli -> sdk -> controller).
# Decision: `agent` must NOT import `gpu_service`. The agent supervises the GPU
# service as a separate process (ARCHITECTURE §3) in its own PyTorch/CUDA
# environment and talks to it only over the GpuService gRPC API, so the agent
# never needs (or gets) torch on its import path. Shared message types live in
# `common` (generated protos).
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "meshforge"

[[tool.importlinter.contracts]]
id = "controller-agent-independent"
name = "controller and agent never import each other"
type = "independence"
modules = ["meshforge.controller", "meshforge.agent"]

[[tool.importlinter.contracts]]
id = "common-is-bottom-layer"
name = "common imports no other meshforge subpackage"
type = "forbidden"
source_modules = ["meshforge.common"]
forbidden_modules = [
    "meshforge.controller",
    "meshforge.agent",
    "meshforge.gpu_service",
    "meshforge.sdk",
    "meshforge.cli",
]

[[tool.importlinter.contracts]]
id = "controller-imports-common-only"
name = "controller imports only common"
type = "forbidden"
source_modules = ["meshforge.controller"]
forbidden_modules = [
    "meshforge.agent",
    "meshforge.gpu_service",
    "meshforge.sdk",
    "meshforge.cli",
]

[[tool.importlinter.contracts]]
id = "agent-imports-common-only"
name = "agent imports only common (gpu_service is a supervised process, not a library)"
type = "forbidden"
source_modules = ["meshforge.agent"]
forbidden_modules = [
    "meshforge.controller",
    "meshforge.gpu_service",
    "meshforge.sdk",
    "meshforge.cli",
]

[[tool.importlinter.contracts]]
id = "gpu-service-imports-common-only"
name = "gpu_service imports only common"
type = "forbidden"
source_modules = ["meshforge.gpu_service"]
forbidden_modules = [
    "meshforge.controller",
    "meshforge.agent",
    "meshforge.sdk",
    "meshforge.cli",
]

[[tool.importlinter.contracts]]
id = "sdk-imports-common-only"
name = "sdk imports only common"
type = "forbidden"
source_modules = ["meshforge.sdk"]
forbidden_modules = [
    "meshforge.controller",
    "meshforge.agent",
    "meshforge.gpu_service",
    "meshforge.cli",
]

[[tool.importlinter.contracts]]
id = "cli-imports-common-and-sdk-only"
name = "cli imports only common and sdk"
type = "forbidden"
source_modules = ["meshforge.cli"]
forbidden_modules = [
    "meshforge.controller",
    "meshforge.agent",
    "meshforge.gpu_service",
]
